<script type="application/json" id="kb-data">{"g":[["引言 · 第一章 声现象","声学",1,[0,1,2]],["光现象","光学",2,[3,4,5,6]],["光的折射 透镜","光学",3,[7,8,9,10,11]],["物态变化","热学",4,[12,13,14,15,16]],["物体的运动","力学",5,[17,18,19,20]],["物质的物理属性","力学",6,[21,22,23]],["力","力学",7,[24,25,26,27]],["力与运动","力学",8,[28,29,30]],["压强和浮力","力学",9,[31,32,33,34,35]],["从粒子到宇宙","物质",10,[36,37,38,39,40]],["简单机械和功","力学",11,[41,42,43,44,45]],["机械能和内能","能量",12,[46,47,48,49]],["简单电路","电学",13,[50,51,52,53]],["欧姆定律","电学",14,[54,55,56,57]],["电功和电热","电学",15,[58,59,60,61]],["电和磁","电学",16,[62,63,64,65]],["电磁波与现代通信","电磁波",17,[66,67,68]],["能源与可持续发展","能源",18,[69,70,71,72,73]]],"p":[["sound-01","声音的产生、传播与声速","声音由物体的振动产生，传播需要介质，在不同介质中的传播快慢不同。",[["由直达传播路程和时间测声速","\u003cmrow>\u003cmi>c\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmi>s\u003c/mi>\u003cmi>t\u003c/mi>\u003c/mfrac>\u003c/mrow>","传播路程和时间采用同一段直达传播过程，结果单位为 m/s。"],["米每秒与千米每小时的换算","\u003cmrow>\u003cmi>v\u003c/mi>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmn>3.6\u003c/mn>&#x2062;\u003cmi>c\u003c/mi>\u003c/mrow>\u003c/mrow>","c 用 m/s 表示、v 用 km/h 表示时，1 m/s = 3.6 km/h。"]],[["s","声音在介质中传播的路程","m"],["t","声音传播这段路程所用的时间","s"],["c","声速，以米每秒表示","m/s"],["v","同一声速换算成千米每小时后的数值","km/h"],["d","声源到反射面的单程距离，用于另一种测声速方法","m"],["t\u003csub>e\u003c/sub>","声音发出到接收到回声的往返时间","s"],["f","声源振动频率，即每秒完成的振动次数","Hz"],["T","声源完成一次完整振动所用的周期","s"],["N","在计时区间内完成的完整振动次数","1"]],[["把 m/s 换成 km/h 时把 3.6 除上去，写成 v = c/3.6。","从米每秒换到千米每小时要同时把米换成千米、秒换成小时，数值应乘 3.6。把 340 m/s 除以 3.6 得到约 94.4 km/h，与正确的 1224 km/h 不符；这是量纲相同但方向错误的单位换算，必须靠数值检查发现。"],["把声速写成路程乘时间，c = s·t。","声速定义为单位时间内传播的路程，应使用路程除以时间。相乘后单位变成 m·s，不是 m/s，量纲检查能抓住。"],["认为声音能在真空中传播，只是传播得比较慢。","声波传播依靠介质中的振动传递；真空没有这种介质。需要用真空罩实验现象和机械波概念辨析，不能由声速计算式判定。"]],"观察声源时，可以用纸屑、薄膜或触摸等方式发现振动；传播时，声音通过固体、液体或气体中的介质传到接收者，真空中不能传播声音。声速把传播路程和时间联系起来；空气温度改变时声速也会变化，因此实验比较要注明条件。控制噪声可在声源处减弱振动，在传播途中隔声或吸声，也可在接收者处使用耳塞等防护。噪声控制不能简单理解成降低声速。",["先选定声源与接收位置，明确测量的是声音实际走过的直达路程 s。","记录声音走完这段路程所用的时间 t；路程和时间的单位要先统一。","用 c = s/t 求出 m/s；若需要 km/h，再把 m/s 的数值乘以 3.6。","声音是否由振动产生、传播是否需要介质，仍需依靠观察和实验现象判断。"],["在空气中测得一段直达声传播 34 m 用时 0.10 s。求声速，并换算成 km/h。",["由声速定义，c = s/t = 34/0.10 = 340 m/s。","换算为 km/h：v = 3.6c = 3.6×340 = 1224 km/h。","检查单位：第一问是 m/s，第二问是 km/h；两者描述同一速度。"],"声速为 340 m/s，即 1224 km/h。"],[],["sound-02","sound-03"],["声音的产生","介质","声速","单位换算","噪声控制"],0],["sound-02","回声与声呐测距","声音遇到障碍物反射后返回，若能分辨出返回的声音，就形成回声。",[["由回声往返时间求反射面距离","\u003cmrow>\u003cmi>d\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi>c\u003c/mi>&#x22C5;\u003cmsub>\u003cmi>t\u003c/mi>\u003cmi>e\u003c/mi>\u003c/msub>\u003c/mrow>\u003cmn>2\u003c/mn>\u003c/mfrac>\u003c/mrow>","公式中的时间是发声到收到回声的往返时间；c 为声音在传播介质中的声速。"],["由已知反射面距离反测声速","\u003cmrow>\u003cmi>c\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmn>2\u003c/mn>&#x2062;\u003cmi>d\u003c/mi>\u003c/mrow>\u003cmsub>\u003cmi>t\u003c/mi>\u003cmi>e\u003c/mi>\u003c/msub>\u003c/mfrac>\u003c/mrow>","反射面单程距离 d 已知，时间必须采用发声到收声的往返时间。"],["回声的往返总路程","\u003cmrow>\u003cmi>l\u003c/mi>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmi>c\u003c/mi>&#x22C5;\u003cmsub>\u003cmi>t\u003c/mi>\u003cmi>e\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/mrow>","计算声音从发出到返回接收点所走过的总路程。"]],[["d","声源到反射面的单程距离","m"],["l","声音发出后往返传播的总路程","m"],["c","声音在介质中的传播速度","m/s"],["t\u003csub>e\u003c/sub>","从发声到接收到回声的往返时间","s"],["s","直达测声速实验中声音传播的路程","m"],["t","直达测声速实验中声音传播的时间","s"],["f","声源振动频率，即每秒完成的振动次数","Hz"],["T","声源完成一次完整振动所用的周期","s"],["N","在计时区间内完成的完整振动次数","1"]],[["把声源到反射面的距离直接写成 d = c·tₑ，忘记计时记录的是往返时间。","往返时间对应的是去程和回程的总路程。把总路程当单程距离会多算一倍；在 68 m 的墙距情境中，错误写法得到 136 m。"],["把往返时间除以 2 后，又把总路程多除一次，写成 d = c·tₑ/4。","公式中的一半已经把往返总路程转成单程距离，不能再重复减半。代入 0.4 s 会得到 34 m，而正确墙距为 68 m。"],["认为听见回声只说明障碍物存在，不需要考虑声速和传播时间。","回声可以用于距离测量，但距离要从介质中的传播速度和往返时间计算。实际声呐还受介质、反射面和回波识别影响，概念判断需人工结合情境审查。"]],"回声测距常用于估计声源到墙面、山体或水下目标的距离。关键不是公式本身，而是先画出传播路径：声音走了一个来回，仪器记录的也是一个来回的时间。若把往返路程直接当成单程距离，答案就会扩大一倍。水下声呐同样依据发射与接收间隔估计目标距离，但实际测量还要考虑水中声速和回波识别条件。",["先明确计时起点是发声时刻，计时终点是接收到回声的时刻。","声音从声源到反射面再返回，传播总路程是单程距离的两倍。","总路程由声速乘往返时间得到，再除以 2 得到声源到反射面的距离。","如果题目给的是单程传播时间，就不再额外除以 2；读清楚计时方式是关键。"],["声呐在水中发出一束声音，0.20 s 后收到目标反射回来的回声。若水中声速取 1500 m/s，求目标距离。",["0.20 s 是声音发出到返回的往返时间，不是单程时间。","目标距离 d = c·tₑ/2 = 1500×0.20÷2 = 150 m。"],"目标距声呐约 150 m。"],["sound-01"],["sound-03"],["回声","声呐","往返时间","单位换算"],0],["sound-03","音调、响度、音色与听觉范围","音调反映声音的高低，和声源振动频率有关；频率表示单位时间内完成的振动次数，周期表示完成一次振动所用的时间。",[["由振动次数求频率","\u003cmrow>\u003cmi>f\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmi>N\u003c/mi>\u003cmi>t\u003c/mi>\u003c/mfrac>\u003c/mrow>","N 统计完整振动次数；t 与频率单位相配，f 的单位为 Hz。"],["由振动周期求频率","\u003cmrow>\u003cmi>f\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmn>1\u003c/mn>\u003cmi>T\u003c/mi>\u003c/mfrac>\u003c/mrow>","T 表示一次完整振动的时间，必须用秒表示，f 的单位为 Hz。"]],[["f","声源振动频率，即每秒完成的振动次数","Hz"],["T","声源完成一次完整振动所用的周期","s"],["N","在计时区间内完成的完整振动次数","1"],["t","统计完整振动次数所用的时间","s"],["d","声源到反射面的单程距离","m"],["l","声音发出后往返传播的总路程","m"],["c","声音在介质中的传播速度","m/s"],["t\u003csub>e\u003c/sub>","从发声到接收到回声的往返时间","s"],["s","直达测声速实验中声音传播的路程","m"]],[["统计多次振动时，只用总时间的倒数当频率，写成 f = 1/t，忘记除以振动次数。","周期倒数只适用于 t 是一次完整振动周期的情形。若 2 s 内发生 400 次完整振动，频率应为 200 Hz；把 1/2 当答案会少算 400 倍。两种写法量纲相同，必须用计数情境做数值检查。"],["把一次完整振动的两个半程都各算作一次完整振动，误写成 f = 2N/t。","一次完整振动包含往复过程，但计数时整体只算一次。重复乘 2 会使频率翻倍；代入 400 次、2 s 会得到 400 Hz，而不是 200 Hz。"],["把音调高低与响度大小当作同一件事。","音调对应声音高低，响度对应声音强弱，描述的听觉特征不同。频率可以帮助比较音调，但不能仅凭频率判断响度；需要人工结合振动幅度和听觉实验核对。"],["认为音色只由一个频率决定，频率相同的声音听起来一定完全相同。","音色还与发声体的振动方式和波形等特征有关，不可简化成单一频率。此类辨析需要结合不同乐器或声源的听辨实验，标记为人工审核。"]],"比较两个声音时，音调高低可通过频率或周期来描述：单位时间内振动次数越多，频率越高，音调通常越高。响度主要与振动幅度及传播条件有关，音色帮助区分发声体，不能仅用一个频率值概括。人耳通常能听到约 20 Hz 到 20 000 Hz 的声音；低于这一范围的叫次声，高于这一范围的叫超声。噪声和音色等定性判断要结合听觉和实验现象，不由频率公式单独裁决。",["在一段已知计时 t 内，数出完成的完整振动次数 N，频率就是 N 除以 t。","若测得一次完整振动所用的时间 T，则一秒内能完成约 1/T 次振动，所以 f = 1/T。","频率与周期互为倒数：频率增大时周期减小，频率减小时周期增大。","音调与频率相关；响度、音色的判断还需要考虑振幅、发声体和传播条件。"],["某声源在 2 s 内完成 1000 次完整振动。求它的频率和周期，并判断其频率是否在通常的可听范围内。",["由振动次数求频率：f = N/t = 1000/2 = 500 Hz。","周期 T = 1/f = 1/500 = 0.002 s。","500 Hz 位于约 20 Hz 至 20 000 Hz 的通常可听范围内。"],"频率为 500 Hz，周期为 0.002 s，位于通常可听范围内。"],["sound-01"],[],["音调","响度","音色","频率","周期","次声","超声"],0],["light-04","光的色彩","白光由多种色光组成；不同色光在真空中的波速相同，但频率和波长不同。",[["由真空光速和波长求频率","\u003cmrow>\u003cmi>f\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmi>c\u003c/mi>\u003cmi>λ\u003c/mi>\u003c/mfrac>\u003c/mrow>","用于真空或可近似看作真空的光传播；光速 c、波长 λ 使用 m/s、m。此关系用于色光的定量拓展，不是判断颜色的唯一依据。"]],[["f","光波频率","Hz"],["λ","光波波长","m"],["c","真空中的光速","m/s"],["s","真空中光传播路程","m"],["t","传播时间","s"]],[["把频率误算为波速乘波长，混淆了相除关系。","真空光速和波长确定后，频率应为 c/λ；多除以 2 会使结果恰好减半。"],["认为白光本身只有一种颜色，或把色光混合与颜料混合规律混为一谈。","棱镜色散可观察到白光分解出的多种色光；色光的叠加与颜料混合不是同一过程。"]],"教材重点是观察色散、认识不同色光及其混合现象；颜色不能用亮度替代。为把观察与可测量量联系起来，这里补充真空电磁波的波速关系：固定光速时，波长越长，频率越低。该换算属于拓展工具，不代替色散实验，也不意味着所有介质中的光速都相同。",["波在一个周期内传播一个波长，因此波速等于波长乘以每秒振动次数。","频率关系 c=λ·f 两边同除以波长，得到 f=c/λ。","代入前统一单位：波长用 m、频率用 Hz，乘积的单位为 m/s。"],["某单色光波长约为 6.0×10⁻⁷ m，取真空光速 3.0×10⁸ m/s，估算其频率。",["辨认所求量是频率，使用 f=c/λ。","代入 f=3.0×10⁸÷6.0×10⁻⁷=5.0×10¹⁴ Hz。"],"频率约为 5.0×10¹⁴ Hz。"],[],["light-01"],["光的色彩","白光","色散","频率","波长","拓展"],1],["light-01","光的直线传播","光在同种均匀介质中沿直线传播；从一种介质进入另一种介质时，传播方向可能改变。",[["由光速和时间求传播路程","\u003cmrow>\u003cmi>s\u003c/mi>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmi>c\u003c/mi>&#x22C5;\u003cmi>t\u003c/mi>\u003c/mrow>\u003c/mrow>","光在同一均匀介质中近似匀速传播，t 使用秒。"],["由传播路程和时间求光速","\u003cmrow>\u003cmi>c\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmi>s\u003c/mi>\u003cmi>t\u003c/mi>\u003c/mfrac>\u003c/mrow>","s 与 t 必须描述同一段光传播过程。"]],[["s","光传播的路程","m"],["c","光传播速度，空气中近似取真空光速","m/s"],["t","光传播所用时间","s"]],[["把单程传播误写成往返路程，平白多乘 2。","题目若只描述光从发出到到达一次，路程就是 c·t；额外乘 2 会把单程误算成往返。"],["认为光在任何介质交界处都不会改变传播方向。","光斜射入另一种介质时可能发生折射；直线传播规律只适用于同种均匀介质。"]],"影子的形成、小孔成像和日食月食都能用光沿直线传播解释。计算传播距离时，要区分单程和往返路程，并让速度、时间和距离采用相容单位。光速关系只能计算传播过程，不能单独决定反射或折射方向。",["光沿直线传播时，路程可由轨迹长度确定；在同种均匀介质中传播速度近似不变。","速度定义为单位时间通过的路程，因此路程等于速度乘时间，速度也可由路程除以时间求出。","统一使用 m/s、s 和 m；若描述的是反射测距往返过程，还要把总路程与单程路程区分。"],["空气中一束光传播 2 微秒，按光速约 3.0×10⁸ m/s 估算路程。",["先换算时间：2 微秒 = 0.000002 s。","使用 s=ct，得到 3.0×10⁸×0.000002=600 m。"],"约 600 m。"],[],["light-02","light-03"],["直线传播","光速","影子","小孔成像"],1],["light-02","平面镜","平面镜所成的像与物体关于镜面对称，是正立、等大的虚像。",[["平面镜像距关系","\u003cmrow>\u003cmi mathvariant=\"normal\">d2\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi mathvariant=\"normal\">d1\u003c/mi>\u003c/mrow>","物距和像距均指垂直于镜面的距离。"],["平面镜像高关系","\u003cmrow>\u003cmi mathvariant=\"normal\">h2\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi mathvariant=\"normal\">h1\u003c/mi>\u003c/mrow>","物体和像的高度采用相同长度单位。"]],[["d1","物体到平面镜的距离","m"],["d2","像到平面镜的距离","m"],["h1","物体高度","m"],["h2","像的高度","m"]],[["误认为像距只有物距的一半。","平面镜成像关于镜面对称，像距等于物距；物距 0.5 m 时像距应是 0.5 m。"],["认为平面镜所成的像可以用光屏接收到。","平面镜像是反射光线反向延长线的交点，属于虚像；应通过成像实验和光线图辨析。"]],"像距要从像点向镜面作垂线测量，物距也按同一方向测量；不能把沿着物体表面的斜距离当成像距。平面镜像是反射光线反向延长线的交点，不能用光屏承接。用等距、等高两项关系检查作图和读数，能快速发现对称位置画错。",["作出法线后，反射定律要求反射角与入射角相等，两角都以法线为基准。","平面镜成像关于镜面对称，因此物点与像点到镜面的垂直距离相等。","对称变换不改变线段长度，所以像的高度与物体高度相同。"],["物体距平面镜 0.8 m、高 0.3 m。求像距和像高，并判断像的性质。",["像与物关于镜面对称，所以像距等于物距，为 0.8 m。","平面镜像正立、等大、虚，所以像高为 0.3 m，不能用光屏承接。"],"像距 0.8 m，像高 0.3 m，成正立、等大的虚像。"],["light-01"],["light-03"],["平面镜","虚像","像距","像高"],1],["light-03","光的反射","光射到物体表面后返回原介质的现象叫反射。",[["反射定律的角度关系","\u003cmrow>\u003cmi>r\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>i\u003c/mi>\u003c/mrow>","入射角和反射角均从法线量起；角度使用度数，且反射发生在同一介质侧。"],["反射线与镜面的夹角","\u003cmrow>\u003cmi>α\u003c/mi>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmn>90\u003c/mn>\u003cmo>−\u003c/mo>\u003cmi>r\u003c/mi>\u003c/mrow>\u003c/mrow>","α 是反射线与镜面的夹角，r 是反射角；法线与镜面互相垂直。"]],[["i","入射角，按度数记录","1"],["r","反射角，按度数记录","1"],["α","反射光线与镜面的夹角，按度数记录","1"]],[["把角度从镜面而不是法线量起，误写成反射角是入射角的两倍。","入射角和反射角都从法线量起；入射角为 30° 时反射角仍是 30°。"],["认为只有光滑表面才发生反射。","漫反射和镜面反射都遵守反射定律，差别在于表面是否平整以及反射光的方向分布。"]],"作图时先找法线，再分别量入射角与反射角，角度不从镜面量起。反射定律可用角度读数检查：入射角变化多少，反射角就变化多少；反射线和镜面之间的夹角则与反射角互为余角。漫反射与镜面反射都遵循反射定律，只是表面情况不同。",["过入射点作垂直于反射面的法线，明确角度的共同基准。","反射定律给出反射角 r 与入射角 i 相等。","法线和镜面夹角为 90°，所以反射线与镜面的夹角 α=90°-r。"],["一束光以 35° 入射到平面镜，求反射角以及反射光线与镜面的夹角。",["反射角从法线量起，依据反射定律 r=i=35°。","法线和镜面互相垂直，所以反射光线与镜面的夹角为 90°-35°=55°。"],"反射角 35°；反射光线与镜面的夹角 55°。"],["light-01"],[],["光的反射","反射定律","法线","入射角","反射角"],1],["lens-03","光的折射","光从一种介质斜射入另一种介质时，传播方向通常发生改变，这种现象叫折射；垂直界面入射时方向不变。",[["折射率与介质中光速的关系","\u003cmrow>\u003cmi>n\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmi>c\u003c/mi>\u003cmi>v\u003c/mi>\u003c/mfrac>\u003c/mrow>","本式为光速比值的定量拓展；c 是真空光速，v 是同一介质中的光速，二者单位相同。"]],[["n","介质的折射率，表示光速比值","1"],["c","真空中的光速","m/s"],["v","光在介质中的传播速度","m/s"],["s","真空中光传播路程","m"],["t","真空中光传播时间","s"]],[["把折射率写成介质光速与真空光速之比。","折射率定义中的比值是 c/v；把速度比倒置并多乘系数会导致结果明显不符。"],["把反射角等于入射角当作折射规律。","反射和折射是不同现象；折射方向需结合两侧介质和法线判断，不能套用反射定律。"]],"观察折射时要先确定界面、法线和入射介质，再判断光线偏向法线还是偏离法线；不能照搬反射角等于入射角。作为定量拓展，可用折射率 n=c/v 表示真空光速与介质中光速之比，但这不是初中折射作图规则的替代品。",["折射率定义为真空中的光速与该介质中光速之比。","写出 n=c/v，并确认分子、分母都是速度，所得比值无单位。","介质中光速越小，c/v 越大；该比值不能单独给出任意入射角下的折射角。"],["某介质中光速约为 2.0×10⁸ m/s，取真空光速 3.0×10⁸ m/s，估算其折射率。",["折射率 n=c/v。","代入 3.0×10⁸÷2.0×10⁸=1.5。"],"折射率约为 1.5。"],["light-01"],["lens-02"],["光的折射","介质","法线","折射率","拓展"],2],["lens-02","透镜","透镜分为凸透镜和凹透镜。",[["凸透镜焦距的几何定义","\u003cmrow>\u003cmi>f\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>d\u003c/mi>\u003c/mrow>","平行于主光轴的光经凸透镜会聚于焦点，f 与 d 使用相同长度单位。"]],[["f","凸透镜焦距","m"],["d","光心到焦点的距离","m"],["u","物距，即物体到凸透镜的距离","m"],["v","像距，即像到凸透镜的距离","m"],["h1","物体高度","m"],["h2","像的高度","m"]],[["把焦距误认为物体到透镜的距离。","焦距是光心到焦点的距离；物距是物体到光心的距离，两者含义不同。"],["认为凹透镜也会把平行光会聚到实焦点。","凹透镜对平行光有发散作用，与凸透镜的会聚作用相反。因此成像规律和透镜种类要对应，不能混淆。"]],"辨认透镜时可观察中间和边缘的厚薄，但判断光线作用应以实际光路为准。测凸透镜焦距可让平行光会聚到焦点，再量光心到焦点的距离。焦距是透镜的基本特征，物距与焦距的比较决定后续成像规律。",["让平行于主光轴的光线通过凸透镜，观察折射后的会聚点。","测量光心到焦点的距离 d，按几何定义得到 f=d。","更换焦距不同的凸透镜重复测量，并用二倍焦距处的成像实验作交叉核对。"],["一凸透镜用平行光测得焦点距光心 12 cm，求焦距，并说明焦距的物理含义。",["焦距按定义等于光心到焦点的距离。","将测得的 12 cm 直接作为 f，并与成像实验测得的焦距比较。"],"焦距为 12 cm，表示光心到焦点的距离。"],["light-01","light-03"],["lens-01"],["透镜","凸透镜","凹透镜","焦点","焦距"],2],["lens-01","凸透镜成像的规律","凸透镜成像性质取决于物距 u 与焦距 f 的关系。",[["物距为二倍焦距时像距等于物距","\u003cmrow>\u003cmi>v\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>u\u003c/mi>\u003c/mrow>","凸透镜成像实验中物距 u=2f，此时为倒立、等大的实像，v=2f。"],["物距为二倍焦距时像高等于物高","\u003cmrow>\u003cmi mathvariant=\"normal\">h2\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi mathvariant=\"normal\">h1\u003c/mi>\u003c/mrow>","凸透镜物距 u=2f 时，像为倒立、等大的实像。"]],[["u","物距，即物体到凸透镜的距离","m"],["v","像距，即像到凸透镜的距离","m"],["h1","物体高度","m"],["h2","像的高度","m"]],[["把物距为二倍焦距时的像距误写成物距的一半。","当 u=2f 时，v 也为 2f，因此 v=u；物距为 0.20 m 时像距不是 0.10 m。"],["认为凸透镜无论物距如何都成倒立实像。","物体位于焦点以内时，凸透镜成正立、放大的虚像；像的性质必须结合物距和焦距判断。"]],"探究成像规律时，先测焦距，再比较物距与 f、2f；移动物体时像的虚实、正倒、大小和像距都会改变。物距等于 2f 是容易核对的特殊位置：像距也等于 2f，像与物等大且倒立。不能把这一特殊结果推广到所有物距。",["通过改变物距并在光屏上寻找清晰像，记录物距、像距和像的大小。","比较物距与焦距的倍数，归纳不同区间对应的实像或虚像性质。","在 u=2f 的特殊位置，实验得到 v=2f、像与物等大；该结论只在这一条件下使用。"],["一凸透镜焦距为 10 cm，将物体放在距透镜 20 cm 处。描述像的位置关系和性质。",["物距 u=20 cm=2f。","物距为二倍焦距时，像距也为二倍焦距，即 v=20 cm。","像为倒立、等大的实像，可以用光屏承接。"],"像距 20 cm，成倒立、等大的实像。"],["lens-02"],["lens-04"],["凸透镜成像","物距","像距","实像","虚像","二倍焦距"],2],["lens-04","透镜的应用","照相机、投影仪和放大镜利用透镜形成不同性质的像。",[["实像放大率与物像距离比","\u003cmrow>\u003cmi>M\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmi>v\u003c/mi>\u003cmi>u\u003c/mi>\u003c/mfrac>\u003c/mrow>","用于凸透镜成倒立实像的几何近似情形；M、u、v 为正值，长度单位须相同。"],["实像高度比定义放大率","\u003cmrow>\u003cmi>M\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmi mathvariant=\"normal\">h2\u003c/mi>\u003cmi mathvariant=\"normal\">h1\u003c/mi>\u003c/mfrac>\u003c/mrow>","像高和物高取正的长度大小，适用于凸透镜实像的几何近似关系。"]],[["M","凸透镜实像的放大率，取高度比的大小","1"],["u","物距，即物体到透镜的距离","m"],["v","像距，即实像到透镜的距离","m"],["h1","物体高度","m"],["h2","像的高度，取高度大小","m"]],[["把放大率写成物距除以像距。","实像放大率应为 v/u；物距 0.30 m、像距 0.15 m 时应为 0.5，而该误式得到 1。"],["认为放大率大于 1 的实像一定正立。","放大率只描述大小比例；凸透镜实像仍是倒立像，正倒要独立判断。"]],"实际应用先按物距和焦距判断成像类型，再结合光屏、镜头或观察者的位置理解成像。放大率公式是几何光学的拓展量化工具：像距相对物距越大，实像的放大率越大；倒立方向另行判断，公式中的高度比取大小。不要把放大率直接等同于“镜头焦距”或亮度。",["用几何光线图中物高与像高构成的相似三角形，可得高度比等于像距与物距之比。","取像高、物高的大小，得到 M=h2/h1；实像倒立这一方向信息另行说明。","代入前统一长度单位；同一情境下由高度比和距离比算出的 M 应一致。"],["某相机镜头成像时物距为 0.30 m、像距为 0.15 m，物体高 4 cm，估算实像大小。",["放大率 M=v/u=0.15/0.30=0.5。","像高大小 h2=Mh1=0.5×4 cm=2 cm。","相机在此情形形成倒立实像，放大率只给大小比。"],"像高大小约 2 cm，成倒立实像。"],["lens-01","lens-02"],["lens-05"],["透镜的应用","照相机","投影仪","放大镜","放大率","拓展"],2],["lens-05","人眼看不见的光","红外线和紫外线都属于人眼不能直接看见的电磁辐射。",[["真空中电磁波的波速关系","\u003cmrow>\u003cmi>c\u003c/mi>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmi>λ\u003c/mi>&#x22C5;\u003cmi>f\u003c/mi>\u003c/mrow>\u003c/mrow>","用于真空中的电磁波；波长用 m、频率用 Hz，所得波速单位为 m/s。"]],[["c","真空中的电磁波速率","m/s"],["λ","电磁波波长","m"],["f","电磁波频率","Hz"],["s","真空中传播路程","m"],["t","传播时间","s"]],[["漏掉波速关系中的频率因子，只把波长当作波速。","波速的单位应为 m/s，而波长单位是 m；还需乘以频率。频率决定单位时间内完整波的个数。"],["认为红外线和紫外线是可见光中两种能被肉眼辨认的颜色。","两者在可见光谱范围之外，需借助热效应、荧光等实验现象或仪器探测。"]],"辨认红外线和紫外线要依据实验现象与用途，不能把“看不见”理解为不存在，也不能把两者混为可见色光。这里以电磁波关系作定量拓展：真空中波速近似相同，波长较长时频率较低。实际应用关注的探测、加热或消毒效果还取决于功率、距离、材料和照射时间，不能仅由波段关系断言。",["电磁波在真空中传播时，波速等于波长乘频率。","将红外或紫外波段的代表性波长与频率代入，检查乘积是否接近真空光速。","该关系描述传播量之间的联系，不单独决定某种辐射对材料或人体的作用效果。"],["某真空红外电磁波的波长约为 1.0×10⁻⁵ m，估算其频率，取波速 3.0×10⁸ m/s。",["由 c=λ·f 得 f=c/λ。","代入 3.0×10⁸÷1.0×10⁻⁵=3.0×10¹³ Hz。"],"频率约为 3.0×10¹³ Hz。"],["light-04"],[],["红外线","紫外线","电磁辐射","波速","波长","频率","拓展"],2],["state-01","物质的三态 温度的测量","物质常见的三种状态是固态、液态和气态；温度表示物体的冷热程度。",[["温度变化量","\u003cmrow>\u003cmi mathvariant=\"normal\">dT\u003c/mi>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmi mathvariant=\"normal\">T2\u003c/mi>\u003cmo>−\u003c/mo>\u003cmi mathvariant=\"normal\">T1\u003c/mi>\u003c/mrow>\u003c/mrow>","T1 为初温，T2 为末温；升温为正变化，降温为负变化。"],["由初温和温差求末温","\u003cmrow>\u003cmi mathvariant=\"normal\">T2\u003c/mi>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmi mathvariant=\"normal\">T1\u003c/mi>\u003cmo>+\u003c/mo>\u003cmi mathvariant=\"normal\">dT\u003c/mi>\u003c/mrow>\u003c/mrow>","dT 带有升温或降温的正负方向。"]],[["T1","变化前温度","℃"],["T2","变化后温度","℃"],["dT","带正负号的温度变化量","℃"],["Tm","标准大气压下纯水的熔点","℃"],["Tm\u003csub>ref\u003c/sub>","纯水熔点参考值","℃"],["Tb","标准大气压下纯水的沸点","℃"],["Tb\u003csub>ref\u003c/sub>","纯水沸点参考值","℃"]],[["求温度变化量时把初温和末温相加。","温度变化量是末温减初温；室温 20℃ 升到 80℃，温差为 60℃，不是 100℃。"],["把降温的温度变化量一律写成正数，丢掉变化方向。","按末温减初温的约定，80℃降到20℃的变化量是 -60℃；若只报告温差大小，应另说“降低了60℃”。"]],"观察物态变化时要先读准温度计：液泡与被测物充分接触，视线与液柱顶端相平。温度变化量按末温减初温计算，升温为正、降温为负；温度本身和温差不是同一个量。用摄氏温标记录时写 ℃，不要把符号写成字母 C。",["把变化前温度记为初温 T1，变化后温度记为末温 T2。","用末温减初温定义带方向的温度变化量，升温为正、降温为负。","将温度变化量移项，可由初温和变化量求得末温。"],["水从 20℃ 加热到 80℃，再冷却到 50℃。分别求两段温度变化量。",["加热段：80-20=60℃。","冷却段：50-80=-30℃，负号表示温度下降。"],"加热变化量为 60℃，冷却变化量为 -30℃。"],[],["state-02","state-03"],["物质三态","温度","温度计","温差"],3],["state-02","汽化和液化","液态变成气态叫汽化，气态变成液态叫液化。",[["标准大气压下纯水沸点","\u003cmrow>\u003cmi mathvariant=\"normal\">Tb\u003c/mi>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi mathvariant=\"normal\">Tb\u003c/mi>\u003cmi mathvariant=\"normal\">ref\u003c/mi>\u003c/msub>\u003c/mrow>","纯水在标准大气压下沸腾；沸点为 100℃。"],["纯水沸点与熔点的温差","\u003cmrow>\u003cmi mathvariant=\"normal\">dT\u003c/mi>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmi mathvariant=\"normal\">Tb\u003c/mi>\u003cmo>−\u003c/mo>\u003cmi mathvariant=\"normal\">Tm\u003c/mi>\u003c/mrow>\u003c/mrow>","两温度均取标准大气压下纯水的相变温度。"]],[["Tb","标准大气压下纯水的沸点","℃"],["Tb\u003csub>ref\u003c/sub>","纯水沸点参考值","℃"],["Tm","标准大气压下纯水的熔点","℃"],["Tm\u003csub>ref\u003c/sub>","标准大气压下纯水的熔点参考值","℃"],["dT","纯水沸点与熔点的温度差","℃"]],[["把纯水的沸点误记成熔点，或把两者互换。","标准大气压下纯水熔点为 0℃、沸点为 100℃，两者相差 100℃；代入沸点情境可查出混淆。"],["认为蒸发只能在沸点发生，或液化只靠压缩一种方法。","蒸发可在任何温度下发生；液化可通过降低温度或压缩体积实现，具体方法取决于物质和条件。"]],"液化是气体放热变成液体，常见方法是降低温度或压缩体积；蒸发快慢受液体温度、表面积和液面上方空气流动影响。沸点受外界气压影响，因此标准大气压下纯水沸点约 100℃，不能把它当作任何条件下都固定的温度。温差公式只用于比较两种相变温度，不意味着水在沸腾时仍持续升温。",["从水的温度—时间实验图像辨认熔化或沸腾期间的温度平台。","读取纯水在标准大气压下的熔点 0℃ 和沸点 100℃，同时注明条件。","两相变温度相减可得到它们之间的温度差，温差单位仍为 ℃。"],["标准大气压下，纯水从冰水共存的 0℃ 加热到沸腾的 100℃，两相变温度相差多少？",["先确认题目给的是标准大气压下的纯水。","温差为 100℃-0℃=100℃。"],"相差 100℃。"],["state-01"],["state-03"],["汽化","蒸发","沸腾","液化","沸点"],3],["state-03","熔化和凝固","固态变成液态叫熔化，液态变成固态叫凝固。",[["熔点与材料参考值相符","\u003cmrow>\u003cmi mathvariant=\"normal\">Tm\u003c/mi>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi mathvariant=\"normal\">Tm\u003c/mi>\u003cmi mathvariant=\"normal\">ref\u003c/mi>\u003c/msub>\u003c/mrow>","纯物质在给定压强下发生熔化或凝固；数值由材料及压强决定。"],["同一纯物质熔点与凝固点关系","\u003cmrow>\u003cmi mathvariant=\"normal\">Tf\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi mathvariant=\"normal\">Tm\u003c/mi>\u003c/mrow>","同一种纯物质，且熔化与凝固的压强条件相同。"]],[["Tm","标准大气压下纯水的熔点","℃"],["Tm\u003csub>ref\u003c/sub>","纯水熔点参考值","℃"],["Tf","同一纯物质在相同压强下的凝固温度","℃"]],[["认为同一纯物质在相同条件下凝固点与熔点不同。","同一纯物质相同压强下凝固点等于熔点；纯萘熔点约 80.2℃ 时，凝固点也约为 80.2℃。"],["把非晶体也描述成熔化时有固定温度平台。","晶体有固定熔点，非晶体没有固定熔点；应结合温度—时间实验曲线区分。"]],"观察晶体熔化曲线时，温度平台对应固液共存阶段；凝固时也会在相同条件下出现相同的相变温度。要先确认材料是不是晶体，并保持压强等条件可比。纯水在标准大气压下的熔点约为 0℃，不可把所有物质的熔点都当成 0℃。",["从水的温度—时间实验图像辨认熔化或沸腾期间的温度平台。","读取纯水在标准大气压下的熔点 0℃ 和沸点 100℃，同时注明条件。","两相变温度相减可得到它们之间的温度差，温差单位仍为 ℃。"],["某纯物质在相同压强下测得熔化温度为 80.2℃，它凝固时的相变温度约是多少？",["确认材料为同一纯物质，且熔化与凝固条件相同。","在相同条件下，凝固点等于熔点。"],"凝固温度约为 80.2℃。"],["state-01"],["state-04"],["熔化","凝固","晶体","熔点","凝固点"],3],["state-04","升华和凝华","固态直接变成气态叫升华，气态直接变成固态叫凝华。",[["密闭装置内相变前后质量守恒","\u003cmrow>\u003cmsub>\u003cmi>m\u003c/mi>\u003cmi mathvariant=\"normal\">后\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>m\u003c/mi>\u003cmi mathvariant=\"normal\">前\u003c/mi>\u003c/msub>\u003c/mrow>","装置密闭且没有物质进出时，升华或凝华前后总质量不变。"],["相变后固体与气体质量合计","\u003cmrow>\u003cmsub>\u003cmi>m\u003c/mi>\u003cmi mathvariant=\"normal\">总\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmsub>\u003cmi>m\u003c/mi>\u003cmi mathvariant=\"normal\">solid\u003c/mi>\u003c/msub>\u003cmo>+\u003c/mo>\u003cmsub>\u003cmi>m\u003c/mi>\u003cmi mathvariant=\"normal\">气\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/mrow>","固体与气体均留在密闭装置内并纳入质量统计。"]],[["m\u003csub>前\u003c/sub>","相变前装置内物质总质量","kg"],["m\u003csub>后\u003c/sub>","相变后装置内物质总质量","kg"],["m\u003csub>solid\u003c/sub>","相变后剩余固体质量","kg"],["m\u003csub>气\u003c/sub>","装置内形成的气体质量","kg"],["m\u003csub>总\u003c/sub>","密闭装置内物质总质量","kg"]],[["把升华理解成物质质量消失。","密闭条件下相变前后总质量相等；把质量加倍会与称量数据不符。这是物质状态和系统边界必须分清的地方。"],["把凝华说成液态直接变成固态。","液态变固态是凝固；凝华是气态直接变成固态。这是物质状态和系统边界必须分清的地方。"]],"干冰逐渐变小、樟脑丸变小是升华的例子；霜的形成属于凝华。若把物质放在密闭且不漏气的装置中，固体减少的质量会对应气体增加的质量；开放环境则不能把逸散的气体当作消失。质量关系是封闭系统内的记录核对，不是升华快慢的计算式。",["先确认研究系统是否密闭；有物质进出时不能直接使用封闭系统的质量守恒。","相变只改变物质状态，不改变被完整统计的物质总量。","密闭时可分别称量前后总质量，并把末态固体与气体质量相加进行复核。"],["密闭装置内原有 2 kg 干冰，升华后剩下 1.2 kg 固体，忽略漏气，求装置内气体质量。",["密闭条件下总质量保持 2 kg。","气体质量=总质量-剩余固体质量=2-1.2=0.8 kg。"],"气体质量为 0.8 kg。"],["state-03"],["state-05"],["升华","凝华","干冰","霜","质量守恒"],3],["state-05","水循环","水在地表、地下和大气之间不断循环，包括蒸发、凝结、降水、径流和渗透等过程。",[["降水深度换算水体积","\u003cmrow>\u003cmi>V\u003c/mi>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmi>A\u003c/mi>&#x22C5;\u003cmi>h\u003c/mi>\u003c/mrow>\u003c/mrow>","把降水视为均匀覆盖所选区域，h 使用 m，A 使用 m²。"],["由降水体积和面积求平均深度","\u003cmrow>\u003cmi>h\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmi>V\u003c/mi>\u003cmi>A\u003c/mi>\u003c/mfrac>\u003c/mrow>","降水均匀铺展且面积非零，体积用 m³、面积用 m²。"]],[["V","所选区域上的降水体积","m³"],["A","所选区域面积","m²"],["h","该区域的平均降水深度","m"]],[["把毫米雨量直接当作米代入，造成千倍偏差。","水量应由面积乘完整的平均深度求得；在情境中再折半会低估体积。"],["认为估算降水体积就是最后实际收集到的水量。","水会发生径流、下渗和蒸发；几何估算只描述均匀降水覆盖区域的理论体积。"]],"水循环把海洋、陆地、大气和生物联系起来；观察到的云、雨、河流和地下水都是循环环节。估算降水体积时要把毫米换成米，并明确所选区域和平均雨量。该几何换算只估算落到区域的水量，不等于实际可收集量，蒸发、径流和渗漏都可能造成差异。",["选定区域并估算其面积 A，同时测量或查得区域平均降水深度 h。","把深度统一换算为 m，体积由底面积乘垂直深度得到 V=A·h。","实际收集水量会受径流、渗漏和蒸发影响，应与几何估算量区分。"],["一片 200 m² 的地面平均降水 15 mm，估算落在该地面上的水体积。",["先换算深度：15 mm=0.015 m。","V=A·h=200×0.015=3 m³。","这只是降水几何估算量，不等于可收集水量。"],"约 3 m³。"],["state-02"],[],["水循环","降水","降水深度","水量估算","拓展"],3],["motion-03","长度与时间的测量","长度用刻度尺测量，时间可用秒表或计时器测量。",[["米换算为厘米","\u003cmrow>\u003cmsub>\u003cmi>L\u003c/mi>\u003cmi mathvariant=\"normal\">cm\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmn>100\u003c/mn>&#x2062;\u003cmsub>\u003cmi>L\u003c/mi>\u003cmi>m\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/mrow>","同一长度的单位换算，1 m=100 cm。"],["米换算为千米","\u003cmrow>\u003cmsub>\u003cmi>L\u003c/mi>\u003cmi mathvariant=\"normal\">km\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmsub>\u003cmi>L\u003c/mi>\u003cmi>m\u003c/mi>\u003c/msub>\u003cmn>1000\u003c/mn>\u003c/mfrac>\u003c/mrow>","同一长度的单位换算，1 km=1000 m。"]],[["L\u003csub>m\u003c/sub>","以米记录的长度","m"],["L\u003csub>cm\u003c/sub>","同一长度以厘米记录","cm"],["L\u003csub>km\u003c/sub>","同一长度以千米记录","km"]],[["把 1 m 误当作 10 cm，导致长度单位换算少一个数量级。","1 m=100 cm；课桌长度 1.2 m 应为 120 cm，而不是 12 cm。"],["读刻度尺时视线倾斜，造成视差并把估读值当作准确值。","视线应垂直刻度面；测量误差需结合分度值和重复测量分析。应记录仪器分度值并按规范重复测量。"]],"测量前先看量程、分度值和零刻线，放置刻度尺时让刻度线与被测边平行；读数时视线垂直刻度面。时间测量要明确起止事件并尽量重复测量减小偶然误差。米、厘米和千米之间的换算有固定比例，错误换算会造成数量级偏差。",["测量对象的长度与计时过程要先定义清楚，并选用合适量程的工具。","记录读数时保留单位；将厘米换成米除以 100，将米换成千米除以 1000。","用两种单位换算后再反算，检查数量级与原始测量是否一致。"],["一张桌子的长度测得 1.2 m，分别换算成厘米和千米。",["厘米：1.2×100=120 cm。","千米：1.2÷1000=0.0012 km。"],"120 cm；0.0012 km。"],[],["motion-01"],["长度测量","时间测量","刻度尺","秒表","单位换算"],4],["motion-01","速度","速度表示物体运动的快慢，数值等于在计时区间内通过的路程与所用时间之比。",[["由路程和时间求速度","\u003cmrow>\u003cmi>v\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmi>s\u003c/mi>\u003cmi>t\u003c/mi>\u003c/mfrac>\u003c/mrow>","路程和时间来自同一运动区间，s 用 m、t 用 s。"],["米每秒换算为千米每小时","\u003cmrow>\u003cmsub>\u003cmi>v\u003c/mi>\u003cmi>k\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmn>3.6\u003c/mn>&#x2062;\u003cmi>v\u003c/mi>\u003c/mrow>\u003c/mrow>","原速度用 m/s 表示，换算后的速度用 km/h 表示。"]],[["s","物体在计时区间内通过的路程","m"],["t","通过路程 s 所用时间","s"],["v","以米每秒表示的速度","m/s"],["v\u003csub>k\u003c/sub>","同一速度以千米每小时表示","km/h"]],[["换算 m/s 与 km/h 时忘记乘 3.6，或把乘除方向写反。","1 m/s=3.6 km/h；5 m/s 应为 18 km/h，而不是约 1.4 km/h。"],["把速度写成路程乘时间。","速度是单位时间内通过的路程，需用路程除以时间；相乘的单位也不再是 m/s。"]],"比较快慢时可控制路程或时间中的一个量不变，也可统一用路程除以时间计算。速度是比值，平均速度描述一段过程而非每一瞬间；单位换算时 1 m/s=3.6 km/h。计算前确认距离和时间用相容单位。",["用刻度尺测出运动路程 s，用秒表测出相应时间 t。","依据速度定义计算 v=s/t；m 除以 s 得到 m/s。","如需换成 km/h，把 m/s 数值乘 3.6，并在比较前统一速度单位。"],["小明 20 s 走过 100 m，求平均速度并换算成 km/h。",["v=s/t=100/20=5 m/s。","换算为 km/h：5×3.6=18 km/h。"],"平均速度为 5 m/s，即 18 km/h。"],[],["motion-02"],["速度","路程","时间","单位换算"],4],["motion-02","直线运动","物体沿直线运动时，位置随时间变化。",[["分段路程和时间求全程平均速度","\u003cmrow>\u003cmover accent=\"true\">\u003cmi>v\u003c/mi>\u003cmo>¯\u003c/mo>\u003c/mover>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi mathvariant=\"normal\">s1\u003c/mi>\u003cmo>+\u003c/mo>\u003cmi mathvariant=\"normal\">s2\u003c/mi>\u003c/mrow>\u003cmrow>\u003cmi mathvariant=\"normal\">t1\u003c/mi>\u003cmo>+\u003c/mo>\u003cmi mathvariant=\"normal\">t2\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003c/mrow>","总路程为各段路程之和，总时间为各段用时之和。"],["分段路程与时间的累计","\u003cmrow>\u003cmsub>\u003cmi>s\u003c/mi>\u003cmi mathvariant=\"normal\">总\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmi mathvariant=\"normal\">s1\u003c/mi>\u003cmo>+\u003c/mo>\u003cmi mathvariant=\"normal\">s2\u003c/mi>\u003c/mrow>\u003c/mrow>","各段路程不重叠且覆盖整个计时区间。"]],[["s1","第一段路程","m"],["s2","第二段路程","m"],["t1","第一段用时","s"],["t2","第二段用时","s"],["s\u003csub>总\u003c/sub>","全程总路程","m"],["t\u003csub>总\u003c/sub>","全程总时间","s"],["\u003cspan style=\"text-decoration:overline\">v\u003c/span>","全程平均速度","m/s"],["v1","第一段平均速度","m/s"],["v2","第二段平均速度","m/s"]],[["不看分段时间和路程条件，直接把两段速度做算术平均。","两段各 100 m 时，10 m/s 与 2 m/s 的算术平均为 6 m/s，但全程平均速度是 200/60≈3.33 m/s。"],["计算全程平均速度时漏掉中途一段或漏计题目要求包含的时间。","平均速度必须与题目界定的整段总路程和总时间对应，计时范围要先确认。"]],"分段运动的全程平均速度要用总路程除以总时间，不能把各段速度简单平均，除非时间或路程条件恰好支持。利用运动图像还要先读横纵轴和单位；折线斜率或面积的含义须根据图轴定义判断。",["按每段路程与用时分别计算分段速度。","把没有重复计算的各段路程相加，并把各段用时相加。","用总路程除以总时间，得到全程平均速度。"],["物体先以 10 m/s 运动 10 s，再以 2 m/s 运动 50 s，求全程平均速度。",["第一段路程 100 m，第二段路程 100 m。","总路程 200 m，总时间 60 s。","平均速度为 200/60≈3.33 m/s。"],"全程平均速度约为 3.33 m/s。"],["motion-01"],["motion-04"],["直线运动","匀速直线运动","变速直线运动","平均速度","分段运动"],4],["motion-04","运动的相对性","判断物体运动还是静止，必须选定参照物。",[["同向运动的相对速度","\u003cmrow>\u003cmsub>\u003cmi>v\u003c/mi>\u003cmi mathvariant=\"normal\">相对\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmsub>\u003cmi>v\u003c/mi>\u003cmi>A\u003c/mi>\u003c/msub>\u003cmo>−\u003c/mo>\u003cmsub>\u003cmi>v\u003c/mi>\u003cmi>B\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/mrow>","两物体沿同一直线同向运动，且 A 的速度大于 B 的速度；取间距改变速度的大小。"],["由间距变化和时间求相对速度","\u003cmrow>\u003cmsub>\u003cmi>v\u003c/mi>\u003cmi mathvariant=\"normal\">相对\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmsub>\u003cmi>s\u003c/mi>\u003cmi mathvariant=\"normal\">gap\u003c/mi>\u003c/msub>\u003cmi>t\u003c/mi>\u003c/mfrac>\u003c/mrow>","间距变化量与时间间隔对应同一段直线运动，t 大于零。"],["相向运动的相对速度","\u003cmrow>\u003cmsub>\u003cmi>v\u003c/mi>\u003cmi mathvariant=\"normal\">相对\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmsub>\u003cmi>v\u003c/mi>\u003cmi>A\u003c/mi>\u003c/msub>\u003cmo>+\u003c/mo>\u003cmsub>\u003cmi>v\u003c/mi>\u003cmi>B\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/mrow>","两物体在同一直线上反向运动或相向而行，取速度大小。"]],[["v\u003csub>A\u003c/sub>","物体 A 沿选定方向的速度大小","m/s"],["v\u003csub>B\u003c/sub>","物体 B 沿选定方向的速度大小","m/s"],["v\u003csub>相对\u003c/sub>","两物体之间的相对速度大小","m/s"],["s\u003csub>gap\u003c/sub>","两物体间距在计时段内改变的大小","m"],["t","观察的时间间隔","s"]],[["不分方向，把同向追及误按速度和计算。","同向追及的间隔变化率应为速度差；12 m/s 和 4 m/s 同向时是 8 m/s，不是 16 m/s。"],["认为运动状态不需要说明参照物。","同一物体对车厢可能静止、对地面可能运动；判断前必须指定参照物。"]],"坐在行驶列车中的乘客相对车厢静止，但相对地面运动，这说明运动描述具有相对性。计算相对速度前先画出方向：同向追及取速度差，反向相向运动取速度和；速度大小关系决定相对位置变化方向，不能只看公式符号。",["先选定参照物和正方向，并判断两物体同向还是反向。","同向运动时位置间隔变化率等于速度大小之差；反向运动时等于速度大小之和。","也可测量一段时间内两物体间距的变化，再用间距变化量除以时间复算相对速度。"],["甲车以 12 m/s 向东行驶，乙车以 4 m/s 同向行驶；两车相距 40 m，求间距每秒变化多少。",["两车同向，取速度差：12-4=8 m/s。","较快的甲车在后方追赶时，两车间距每秒减小 8 m；方向要结合相对位置判断。"],"间距变化速率为 8 m/s。"],["motion-01","motion-02"],[],["运动的相对性","参照物","相对速度","追及","相向运动"],4],["prop-03","质量及其测量","质量表示物体所含物质的多少，国际单位是千克，实验中常用天平测量。",[["克换算为千克","\u003cmrow>\u003cmsub>\u003cmi>m\u003c/mi>\u003cmi mathvariant=\"normal\">kg\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmsub>\u003cmi>m\u003c/mi>\u003cmi>g\u003c/mi>\u003c/msub>\u003cmn>1000\u003c/mn>\u003c/mfrac>\u003c/mrow>","同一质量单位换算，1000 g=1 kg。"],["千克换算为克","\u003cmrow>\u003cmsub>\u003cmi>m\u003c/mi>\u003cmi>g\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmn>1000\u003c/mn>&#x2062;\u003cmsub>\u003cmi>m\u003c/mi>\u003cmi mathvariant=\"normal\">kg\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/mrow>","同一质量单位换算，1 kg=1000 g。"]],[["m\u003csub>g\u003c/sub>","以克记录的质量","g"],["m\u003csub>kg\u003c/sub>","同一质量以千克记录","kg"]],[["克换千克时少除一个 10，产生十倍偏差。","450 g 应为 0.45 kg；若只除以 100，会得到 4.5 kg。"],["认为物体移到月球后质量随重力变小。","质量表示物体所含物质多少，不随位置变化；变化的是物体受到的重力。"]],"使用天平前先放平、调平衡，再把物体和砝码按规范放置，砝码质量与游码示数相加得到物体质量。称量结果常需在 g 与 kg 之间换算；克数与千克数表示同一质量，不代表物体发生变化。测量值应根据仪器分度值合理记录。",["用天平测得物体质量，并记录天平示数和所用质量单位。","按 1 kg=1000 g 换算：克换成千克除以 1000，千克换成克乘以 1000。","换算后再反向换回，核对读数是否与原始称量一致。"],["天平测得一块金属质量为 780 g，换算成千克。",["1000 g=1 kg。","780÷1000=0.780 kg。"],"质量为 0.780 kg。"],[],["prop-01"],["质量","天平","千克","克","质量测量"],5],["prop-01","密度","密度是物质单位体积的质量，等于物体质量与体积之比。",[["由质量和体积求密度","\u003cmrow>\u003cmi>ρ\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmi>m\u003c/mi>\u003cmi>V\u003c/mi>\u003c/mfrac>\u003c/mrow>","质量和体积对应同一物体，且 m 用 kg、V 用 m³。"],["由密度和体积求质量","\u003cmrow>\u003cmi>m\u003c/mi>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmi>ρ\u003c/mi>&#x22C5;\u003cmi>V\u003c/mi>\u003c/mrow>\u003c/mrow>","物体密度均匀，ρ 用 kg/m³、V 用 m³。"],["读取质量—体积图线斜率求密度","\u003cmrow>\u003cmi>ρ\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmsub>\u003cmi>m\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003cmo>−\u003c/mo>\u003cmsub>\u003cmi>m\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003c/mrow>\u003cmrow>\u003cmsub>\u003cmi>V\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msub>\u003cmo>−\u003c/mo>\u003cmsub>\u003cmi>V\u003c/mi>\u003cmn>1\u003c/mn>\u003c/msub>\u003c/mrow>\u003c/mfrac>\u003c/mrow>","同一种均匀物质的质量—体积图线为正比例关系，读数点体积不同且质量、体积单位统一。"]],[["m","物体质量","kg"],["V","物体体积","m³"],["ρ","物质密度","kg/m³"],["m\u003csub>1\u003c/sub>","质量—体积图线上第一个读数点的质量","kg"],["m\u003csub>2\u003c/sub>","质量—体积图线上第二个读数点的质量","kg"],["V\u003csub>1\u003c/sub>","质量—体积图线上第一个读数点的体积","m³"],["V\u003csub>2\u003c/sub>","质量—体积图线上第二个读数点的体积","m³"],["V1","放入物体前液体体积","mL"],["V2","物体完全浸入后液体总体积","mL"],["V\u003csub>o\u003c/sub>","被测物体体积","mL"]],[["质量已经用 kg 表示时，又多除以 1000，造成密度少算 1000 倍。","情境中的质量已是 kg，无须再次换算成吨；一升水应为 1000 kg/m³，不是 1 kg/m³。"],["把密度写成体积除以质量。","密度定义是单位体积的质量；质量越多而体积不变时，密度应增大。"],["认为同一种物质的物体质量越大，密度一定越大。","在温度和状态相同、物质均匀时，质量和体积同比变化，密度不随样品多少改变。"]],"测密度要分别可靠地测质量和体积，再用质量除以体积；不规则物体可用排水法测体积。读质量—体积图线时，密度对应斜率而不是任意一点的纵坐标。先统一质量和体积单位，常见换算为 1 g/cm³=1000 kg/m³。",["密度定义为质量与体积的比值，先确认两者属于同一物体。","用 m/V 计算密度并检查单位，kg 除以 m³ 得到 kg/m³。","在质量—体积图线上选取两个不同体积的点，用质量差除以体积差求斜率；均匀物质的该斜率就是密度。","将定义式变形，可由密度和体积求质量。"],["一块均匀材料质量为 2 kg，体积为 0.001 m³，求密度。",["ρ=m/V=2/0.001=2000 kg/m³。","单位为 kg/m³，表示每立方米该材料的质量。"],"密度为 2000 kg/m³。"],[],["prop-02"],["密度","质量","体积","质量体积图像"],5],["prop-02","密度知识的应用与物质的物理属性","密度知识可用于鉴别材料、判断空心与实心、估测质量或体积；物质还具有硬度、弹性、导电性、导热性和磁性等属性。",[["排水法求物体体积","\u003cmrow>\u003cmsub>\u003cmi>V\u003c/mi>\u003cmi>o\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmi mathvariant=\"normal\">V2\u003c/mi>\u003cmo>−\u003c/mo>\u003cmi mathvariant=\"normal\">V1\u003c/mi>\u003c/mrow>\u003c/mrow>","物体完全浸没、不吸水且液体体积读数单位相同。"],["由排水体积求材料密度","\u003cmrow>\u003cmi>ρ\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmi>m\u003c/mi>\u003cmsub>\u003cmi>V\u003c/mi>\u003cmi>o\u003c/mi>\u003c/msub>\u003c/mfrac>\u003c/mrow>","物体质量以 g、测得体积以 mL 计，密度单位为 g/mL。"]],[["V1","放入物体前液体体积","mL"],["V2","物体完全浸入后液体总体积","mL"],["V\u003csub>o\u003c/sub>","被测物体体积","mL"],["m","被测物体质量","g"],["ρ","被测物体密度","g/mL"],["V","物体体积","m³"],["m\u003csub>1\u003c/sub>","质量—体积图线上第一个读数点的质量","kg"],["m\u003csub>2\u003c/sub>","质量—体积图线上第二个读数点的质量","kg"],["V\u003csub>1\u003c/sub>","质量—体积图线上第一个读数点的体积","m³"],["V\u003csub>2\u003c/sub>","质量—体积图线上第二个读数点的体积","m³"]],[["把物体体积写成放入前后液体读数之和。","物体排开的是液面增加的部分，应以后读数减前读数；50 mL 升至 70 mL，物体体积为 20 mL。"],["物体未完全浸没或吸水时，仍直接把液面差当作物体体积。","排水法成立需要完全浸没、体积读数可靠且物体不吸水、不溶解；实验条件不满足时需改用其他方法。"]],"同一种材料通常具有相对稳定的密度，但温度、状态和测量误差会影响实际数值；判断材料时应结合多个证据。密度只是物质多种物理属性之一，不能用密度代替硬度、导电性或磁性。排水法读数时要排除气泡并保证物体完全浸没且不溶于水。",["读取物体浸入前量筒体积 V1。","将物体完全浸没，读取液体总体积 V2。","用 V2-V1 得到排开液体体积，并在适用条件下视为物体体积。","若还测得物体质量，用 m/V\u003csub>o\u003c/sub> 求密度。"],["物体质量 54 g，浸入前量筒读数 50 mL，完全浸没后为 70 mL，求体积和密度。",["V\u003csub>o\u003c/sub>=70-50=20 mL。","ρ=54/20=2.7 g/mL。"],"体积为 20 mL，密度为 2.7 g/mL。"],["prop-01"],[],["密度应用","排水法","物质的物理属性","材料鉴别","拓展"],5],["force-03","力 弹力","物体发生弹性形变时会产生弹力，弹力方向与形变方向相反。",[["线性弹簧弹力与形变量关系","\u003cmrow>\u003cmsub>\u003cmi>F\u003c/mi>\u003cmi>e\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmi>k\u003c/mi>&#x22C5;\u003cmi>x\u003c/mi>\u003c/mrow>\u003c/mrow>","仅用于弹性限度内近似线性的弹簧；x 是相对原长的形变量。"],["由弹力和劲度系数求形变量","\u003cmrow>\u003cmi>x\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmsub>\u003cmi>F\u003c/mi>\u003cmi>e\u003c/mi>\u003c/msub>\u003cmi>k\u003c/mi>\u003c/mfrac>\u003c/mrow>","弹簧仍在线性弹性范围内，k 大于零。"]],[["F\u003csub>e\u003c/sub>","弹簧弹力大小","N"],["k","线性弹簧劲度系数","N/m"],["x","弹簧相对原长的形变量","m"]],[["线性弹簧计算中漏掉劲度系数与形变量乘积的一半因子。","在已确认线性范围内，弹力按 kx 计算；小形变情境中漏乘比例系数会得到一半结果。"],["认为任何材料、任何形变都遵守线性弹簧关系。","线性关系只适用于弹性限度内近似线性的弹簧；塑性形变或超过弹性限度时不可套用。"]],"弹力可以通过弹簧测力计感受和测量，弹簧伸长量越大，弹力通常越大。这里的 F=kx 是线性弹簧的拓展模型，教材基础要求主要是辨认弹力、方向和产生条件；实际弹簧若发生明显弯折、塑性形变或接近极限，比例关系不再适用。",["确定弹簧原长和受力后的长度，两者之差为形变量 x。","在线性弹性范围内，实验表明弹力大小与形变量成正比，比例系数为 k。","使用 F\u003csub>e\u003c/sub>=kx 前检查弹簧没有超过弹性限度，并统一 N、N/m 和 m。"],["劲度系数为 100 N/m 的弹簧在弹性限度内伸长 0.03 m，估算弹力。",["确认形变量在弹性限度内。","F\u003csub>e\u003c/sub>=kx=100×0.03=3 N。"],"弹力约为 3 N。"],["force-01"],["force-04"],["弹力","弹性形变","弹簧","劲度系数","拓展"],6],["force-01","重力 力的示意图","地球附近的物体受到重力，重力方向竖直向下，大小与物体质量近似成正比。",[["质量与重力的关系","\u003cmrow>\u003cmi>G\u003c/mi>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmi>m\u003c/mi>&#x22C5;\u003cmi>g\u003c/mi>\u003c/mrow>\u003c/mrow>","近地面估算时取 g≈10 N/kg；更精确计算可按题目给定 g。"],["由重力估算质量","\u003cmrow>\u003cmi>m\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmi>G\u003c/mi>\u003cmi>g\u003c/mi>\u003c/mfrac>\u003c/mrow>","重力 G 与当地重力加速度 g 已知，且 g 不为零。"]],[["G","物体所受重力","N"],["m","物体质量","kg"],["mg","以克记录的质量数值，代入前要换成 kg","g"],["g","当地重力与质量的比值，估算取 10 N/kg","N/kg"],["F\u003csub>AB\u003c/sub>","物体 A 对物体 B 的作用力大小","N"],["F\u003csub>BA\u003c/sub>","物体 B 对物体 A 的作用力大小","N"],["F\u003csub>ABx\u003c/sub>","A 对 B 的作用力沿选定方向的分量，正负表示方向","N"],["F\u003csub>BAx\u003c/sub>","B 对 A 的作用力沿同一选定方向的分量，正负表示方向","N"],["F\u003csub>sum\u003c/sub>","这两个相互作用力沿选定方向的分量代数和","N"]],[["质量以克记录时，把克的数值直接当作 kg 代入重力公式。","200 g 应先换成 0.2 kg；把数值 200 直接代入会把重力算大 1000 倍。"],["把重力写成质量除以 g。","g 的单位是 N/kg，重力应为 m·g 才得到 N；除法会得到不符合力单位的结果。"],["把质量和重力看成同一个量，直接用 kg 表示重力。","质量单位为 kg，重力单位为 N；二者通过当地 g 联系，但概念和单位不同。"]],"在地球表面附近常用 G=mg 估算重力，比例系数 g 约为 9.8 N/kg，粗略计算可取 10 N/kg。质量和重力不是同一个量：质量用 kg，重力用 N。画示意图时箭头方向表示力方向，线段长短可按比例表示大小，不要把重力方向画成总是垂直于斜面。",["物体质量为 m，每千克物体受到的重力用 g 表示。","重力随质量成正比，所以重力大小为 G=m·g。","移项可由重力与当地 g 反算物体质量。"],["一只质量 3 kg 的物体在地面附近运动，取 g=10 N/kg，求其重力。",["G=mg=3×10=30 N。","重力方向竖直向下。"],"重力大小为 30 N，方向竖直向下。"],[],["force-02"],["重力","质量","力的示意图","竖直向下"],6],["force-04","摩擦力","两个相互接触的物体发生或将要发生相对运动时，接触面会产生阻碍相对运动的摩擦力。",[["匀速水平拉动时摩擦力等于拉力","\u003cmrow>\u003cmsub>\u003cmi>F\u003c/mi>\u003cmi>f\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>F\u003c/mi>\u003cmi mathvariant=\"normal\">pull\u003c/mi>\u003c/msub>\u003c/mrow>","木块在水平面上匀速运动，且水平方向只有拉力和滑动摩擦力。"],["匀速滑动时水平合力","\u003cmrow>\u003cmsub>\u003cmi>F\u003c/mi>\u003cmi mathvariant=\"normal\">合\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmsub>\u003cmi>F\u003c/mi>\u003cmi mathvariant=\"normal\">pull\u003c/mi>\u003c/msub>\u003cmo>−\u003c/mo>\u003cmsub>\u003cmi>F\u003c/mi>\u003cmi>f\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/mrow>","沿运动方向取正，水平合力等于拉力减去反向摩擦力；匀速时合力为零。"]],[["F\u003csub>f\u003c/sub>","滑动摩擦力大小","N"],["F\u003csub>pull\u003c/sub>","水平拉力大小","N"],["F\u003csub>合\u003c/sub>","水平方向合力","N"]],[["在水平匀速实验中把摩擦力误算为拉力的一半。","水平方向只有拉力和摩擦力且物体匀速时，两力平衡，大小应相等。"],["认为摩擦力总是阻碍物体相对地面的运动。","摩擦力阻碍的是接触面间的相对运动或相对运动趋势，方向应结合两个接触物体判断。"]],"摩擦力大小受压力和接触面情况等因素影响，不能仅凭物体是否运动判断。水平面上用弹簧测力计匀速拉动木块，若水平方向只受拉力和滑动摩擦力，则两力平衡，拉力读数等于摩擦力大小。改变条件时要区分静摩擦和滑动摩擦，不能把本实验结论推广到所有情况。",["确定接触面和相对运动方向，先画出摩擦力方向。","木块匀速说明速度不变；在水平方向只有拉力和摩擦力时，合力为零。","因此两力大小相等；若存在其他水平力或木块有加速度，需重新列合力。"],["水平桌面上木块被 3 N 的水平拉力匀速拉动，水平方向只有拉力和摩擦力，求摩擦力。",["匀速说明水平方向合力为零。","摩擦力与拉力反向且大小相等。"],"摩擦力大小为 3 N。"],["force-01"],["force-02"],["摩擦力","滑动摩擦","匀速","受力平衡"],6],["force-02","力的作用是相互的","物体间的相互作用总是成对出现：物体 A 对 B 施力时，B 同时对 A 施加大小相等、方向相反的力。",[["相互作用力大小相等","\u003cmrow>\u003cmsub>\u003cmi>F\u003c/mi>\u003cmi mathvariant=\"normal\">AB\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>F\u003c/mi>\u003cmi mathvariant=\"normal\">BA\u003c/mi>\u003c/msub>\u003c/mrow>","比较同一时刻同一对相互作用力的大小，方向相反且作用在不同物体上。"],["同一方向轴上的相互作用力分量相反","\u003cmrow>\u003cmsub>\u003cmi>F\u003c/mi>\u003cmi mathvariant=\"normal\">sum\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmsub>\u003cmi>F\u003c/mi>\u003cmi mathvariant=\"normal\">ABx\u003c/mi>\u003c/msub>\u003cmo>+\u003c/mo>\u003cmsub>\u003cmi>F\u003c/mi>\u003cmi mathvariant=\"normal\">BAx\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/mrow>","沿同一直线选定正方向记录两个力的分量时，两个力同时作用且方向相反。"]],[["F\u003csub>AB\u003c/sub>","物体 A 对物体 B 的作用力大小","N"],["F\u003csub>BA\u003c/sub>","物体 B 对物体 A 的作用力大小","N"],["F\u003csub>ABx\u003c/sub>","A 对 B 的作用力沿选定方向的分量，正负表示方向","N"],["F\u003csub>BAx\u003c/sub>","B 对 A 的作用力沿同一选定方向的分量，正负表示方向","N"],["F\u003csub>sum\u003c/sub>","这两个相互作用力沿选定方向的分量代数和","N"]],[["认为较重的物体受到的相互作用力必定更大。","相互作用力总是大小相等、方向相反，但分别作用在两个物体上；物体质量不同不会改变这对力的大小关系。"],["把作用在两个物体上的相互作用力当成作用在一个物体上的平衡力。","平衡力作用在同一物体上，而相互作用力分别作用在两个物体上；即使大小相等，也不能把这两类力混为一谈。"]],"判断一对相互作用力时要同时指出施力物体和受力物体，再比较大小、方向和作用时间。船桨推水、水推船向前，说明作用力和反作用力分别作用在不同物体上。不能把它们误当成同一物体的平衡力。",["先确定施力物体和受力物体，给两个力分别标记作用对象。","观察或用相互作用实验比较同一时刻两力的大小。","作用力与反作用力大小相等、方向相反，但分别作用于两个物体。"],["学生用 30 N 的力推墙，墙对学生的作用力大小是多少？",["学生对墙和墙对学生是一对相互作用力。","同一对力大小相等、方向相反，故墙对学生的力大小为 30 N。"],"30 N。"],[],[],["相互作用力","作用力与反作用力","大小相等","方向相反"],6],["fmotion-01","二力平衡","物体在两个力作用下保持静止或匀速直线运动时，这两个力互相平衡。",[["反向共线两力的合力","\u003cmrow>\u003cmsub>\u003cmi>F\u003c/mi>\u003cmi mathvariant=\"normal\">合\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmi mathvariant=\"normal\">F1\u003c/mi>\u003cmo>−\u003c/mo>\u003cmi mathvariant=\"normal\">F2\u003c/mi>\u003c/mrow>\u003c/mrow>","F1、F2 沿同一直线且方向相反；正方向取为 F1 方向。"],["二力平衡条件","\u003cmrow>\u003cmi mathvariant=\"normal\">F1\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi mathvariant=\"normal\">F2\u003c/mi>\u003c/mrow>","两个力作用在同一物体、同一直线上且方向相反。"]],[["F1","沿选定方向的第一个力的大小","N"],["F2","与第一个力反向的第二个力的大小","N"],["F\u003csub>合\u003c/sub>","沿选定方向的合力","N"]],[["两个反向力大小相等时，把合力写成两力相加。","方向相反的共线力应按选定正方向做代数相减；5 N 与 5 N 反向合力为零。"],["认为合力为零就说明物体一定静止。","合力为零时物体保持原来的运动状态；原来运动的物体可继续做匀速直线运动。"]],"判断二力是否平衡，不能只看大小相等，还要检查方向、作用线和研究对象。沿同一直线取一个正方向后，反向两力的合力可用带方向的代数和表示；平衡时合力为零。作用力和反作用力虽然大小相等方向相反，但作用于不同物体，不能当作同一物体上的平衡力。",["先画出物体所受力，确认两个力作用在同一物体上。","检查两力是否在同一直线、方向相反且大小相等。","沿选定方向计算代数和，等大反向时合力为零。","依据合力为零，物体保持静止或匀速直线运动状态。"],["木块在水平面上受到 8 N 向右拉力，并以 8 N 的摩擦力向左运动。判断水平方向合力和运动状态。",["取向右为正方向，合力为 8-8=0 N。","合力为零可保持已有运动状态；若木块原来匀速，则继续匀速直线运动。"],"水平方向合力为 0 N；若原来匀速，将保持匀速直线运动。"],["force-02"],["fmotion-02"],["二力平衡","合力","平衡条件","受力分析"],7],["fmotion-02","牛顿第一定律","一切物体在没有受到外力作用时，总保持静止状态或匀速直线运动状态。",[["匀速直线运动的速度","\u003cmrow>\u003cmi>v\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmi>s\u003c/mi>\u003cmi>t\u003c/mi>\u003c/mfrac>\u003c/mrow>","物体沿直线运动且速度大小不变，路程与计时区间匹配。"],["合力为零时速度保持不变","\u003cmrow>\u003cmi mathvariant=\"normal\">v2\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi mathvariant=\"normal\">v1\u003c/mi>\u003c/mrow>","沿直线运动且合力为零；此式描述速度大小不变，方向也保持不变。"]],[["s","匀速直线运动通过的路程","m"],["t","通过路程所用的时间","s"],["v","匀速直线运动速度","m/s"],["v1","运动开始时速度","m/s"],["v2","一段时间后速度","m/s"]],[["速度已用 m/s 代入路程关系时，又额外乘 3.6，误把 km/h 换算重复做了一次。","匀速小车速度 10 m/s、时间 5 s，路程应为 50 m；再乘 3.6 会错算为 180 m。"],["把惯性说成物体继续运动的一个力。","惯性是物体本身的性质，不是力；分析速度改变仍要检查物体受到的合力。"],["认为只有运动物体才有惯性，静止物体没有惯性。","惯性是所有物体的固有属性，静止物体也保持静止状态，质量越大惯性越大。"]],"惯性是物体保持原来运动状态的性质，质量越大通常越难改变运动状态。力不是维持运动的原因，而是改变运动状态的原因；当合力为零，物体可以静止，也可以保持原有速度做匀速直线运动。解释现象时要区分“有速度”和“有合力”。",["惯性使物体具有保持原有运动状态的倾向，不是额外施加在物体上的力。","合力为零时，物体的运动状态不发生改变。","若物体已沿直线匀速运动，则一段时间前后的速度相同。"],["传送带使物体沿直线以 8 m/s 匀速运动 3 s，求路程，并说明合力为零时速度如何变化。",["路程 s=vt=8×3=24 m。","若合力为零，物体保持原来的匀速直线运动状态。"],"路程为 24 m；合力为零时速度保持不变。"],["fmotion-01"],["fmotion-03"],["牛顿第一定律","惯性","运动状态","合力为零"],7],["fmotion-03","力与运动的关系","合力会改变物体的运动状态。",[["恒定合力与加速度关系","\u003cmrow>\u003cmsub>\u003cmi>F\u003c/mi>\u003cmi mathvariant=\"normal\">合\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmi>m\u003c/mi>&#x22C5;\u003cmi>a\u003c/mi>\u003c/mrow>\u003c/mrow>","质量不变且合力恒定时；单位分别为 kg、m/s²、N。"],["速度变化率表示加速度","\u003cmrow>\u003cmi>a\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmi mathvariant=\"normal\">dv\u003c/mi>\u003cmi>t\u003c/mi>\u003c/mfrac>\u003c/mrow>","加速度取速度变化量除以同一时间间隔，t 大于零。"]],[["F\u003csub>合\u003c/sub>","物体所受合力大小","N"],["m","物体质量","kg"],["a","物体加速度大小","m/s²"],["dv","一段时间内速度变化量","m/s"],["t","速度变化所用时间","s"]],[["把合力与加速度的乘积误写成其一半。","牛顿第二定律的拓展模型为 F\u003csub>合\u003c/sub>=m·a；2 kg 小车加速度 2 m/s² 时合力应为 4 N。"],["认为物体只要在运动，就一定受到沿运动方向的合力。","物体可以在合力为零时保持匀速直线运动；合力决定运动状态如何改变，不是维持运动的必要条件。"]],"观察相同质量的小车受到不同合力时的运动变化，可发现合力越大，加速度越大；质量相同时，合力相同而质量更大，加速度更小。这里用 F\u003csub>合\u003c/sub>=m·a 把趋势定量表达，要求质量不变、合力恒定且单位统一为 kg、N、m/s²。初中课程首先要求理解力能改变运动状态。",["确定研究对象，先合成同一直线上的各个力，得到合力 F\u003csub>合\u003c/sub>。","在质量不变且合力恒定时，合力与加速度大小满足 F\u003csub>合\u003c/sub>=m·a。","也可从速度变化量和时间求加速度，再与合力除以质量的结果比较。"],["质量 2 kg 的小车受到大小为 4 N 的恒定合力，估算其加速度。",["使用拓展关系 a=F\u003csub>合\u003c/sub>/m。","代入 4÷2=2 m/s²，并确认合力方向与加速度方向一致。"],"加速度大小约为 2 m/s²。"],["fmotion-02"],[],["力与运动","合力","加速度","牛顿第二定律","拓展"],7],["pressure-01","压强","压力是垂直作用在接触面上的力；压强表示单位面积上受到的压力，p=F/S。",[["压力与受力面积求压强","\u003cmrow>\u003cmi>p\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmi>F\u003c/mi>\u003cmi>S\u003c/mi>\u003c/mfrac>\u003c/mrow>","F 垂直接触面，F 用 N、S 用 m2，结果 p 用 Pa。"],["由压强和面积求压力","\u003cmrow>\u003cmi>F\u003c/mi>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmi>p\u003c/mi>&#x22C5;\u003cmi>S\u003c/mi>\u003c/mrow>\u003c/mrow>","压力垂直作用于面积 S，压强 p 均匀。"]],[["F","垂直接触面的压力","N"],["S","受力面积","m2"],["p","压强","Pa"],["ρ","液体密度","kg/m³"],["g","当地重力加速度","N/kg"],["h","测点到液面的竖直深度","m"]],[["把 cm2 换算成 m2 时只按 100 倍换算面积，少考虑了长度单位平方。","1 m2=10 000 cm2；窄底面积 0.02 m2 对应 200 cm2，少换算 100 倍会把压强算小 100 倍。"],["把压强写成压力乘以面积。","压强表示单位面积上的压力，应除以面积；F·S 的单位也不是 Pa。"],["认为受力面积越大，压力固定时压强也越大。","同一压力分摊到更大的受力面积上，单位面积承担的压力会减小，因此压强减小；压力和压强不能混为一个量。"]],"压强能描述压力作用效果。计算固体压强时使用垂直接触面的压力和实际受力面积；不能把物体全部表面积当作受力面积。增大压力或减小受力面积通常会增大压强；单位 Pa 等于 N/m²。",["确定垂直作用于接触面的压力 F。","测量承受压力的面积 S 并统一为 m2。","把 F 除以 S 得压强 p；也可由 p 和 S 反算压力。"],["重 100 N 的物体对水平地面的受力面积为 0.02 m2，求压强。",["物体静止且水平面支撑时，压力大小为 100 N。","p=F/S=100/0.02=5000 Pa。"],"压强为 5000 Pa。"],["force-01"],["pressure-02"],["压强","压力","受力面积","帕斯卡"],8],["pressure-02","液体的压强","液体内部向各个方向都有压强；同种液体中深度越大，压强越大。",[["液体密度和深度求内部压强","\u003cmrow>\u003cmi>p\u003c/mi>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmrow>\u003cmi>ρ\u003c/mi>&#x22C5;\u003cmi>g\u003c/mi>\u003c/mrow>&#x22C5;\u003cmi>h\u003c/mi>\u003c/mrow>\u003c/mrow>","静止液体中测点相对液面的深度 h 用 m，ρ 用 kg/m³。"],["由液体压强和面积求压力","\u003cmrow>\u003cmi>F\u003c/mi>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmi>p\u003c/mi>&#x22C5;\u003cmi>S\u003c/mi>\u003c/mrow>\u003c/mrow>","压强在所取小面积上近似均匀，F 用 N、S 用 m2。"]],[["p","液体内部压强","Pa"],["ρ","液体密度","kg/m³"],["g","当地重力加速度","N/kg"],["h","测点到液面的竖直深度","m"],["S","受液体压强作用的面积","m2"],["F","该面积上液体压力","N"]],[["深度已经用 m 表示，却又把它当成 cm 数值额外放大 100 倍。","水下 0.1 m 的压强为 1000 Pa；重复做厘米换算会错误得到 100 000 Pa。"],["把液体深度误写成容器底部的斜向长度。","液体压强公式中的 h 是竖直深度；把面积代入会造成量纲不符。"],["认为容器越宽或形状不同，同种液体同深度处的压强必然不同。","静止同种液体的压强由密度、重力加速度和竖直深度决定，不由容器外形直接决定。"]],"深度 h 从液面向下竖直测量，不是沿斜面或容器壁量出的距离。液体压强还会传向容器侧壁和底部；同一深度的压强与容器形状无关。利用压强求某一面积上的压力时再用 F=pS，避免把压强和压力混淆。",["取静止液体中距液面深度为 h 的位置。","该位置上方液柱的重力随液体密度、重力加速度和高度变化。","液柱压力作用于单位面积后得到 p=ρ·g·h。","若进一步求某面积上的压力，用压强乘面积。"],["水中距液面 0.2 m 处的压强是多少？取水密度 1000 kg/m³、g=10 N/kg。",["p=ρ·g·h=1000×10×0.2=2000 Pa。","深度取竖直距离，单位为 m。"],"液体压强为 2000 Pa。"],["pressure-01"],["pressure-03"],["液体压强","液体深度","密度","液体压力"],8],["pressure-03","气体的压强","气体会对容器壁和浸入其中的物体产生压强；大气也对地面和物体施加压强。",[["由水银柱高度估算大气压","\u003cmrow>\u003cmi>p\u003c/mi>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmrow>\u003cmi>ρ\u003c/mi>&#x22C5;\u003cmi>g\u003c/mi>\u003c/mrow>&#x22C5;\u003cmi>h\u003c/mi>\u003c/mrow>\u003c/mrow>","静止水银柱的压强估算，忽略液面压强差；h 为竖直高度。"]],[["p","水银柱对应的大气压估值","Pa"],["ρ","水银密度","kg/m³"],["g","重力加速度","N/kg"],["h","水银柱的竖直高度","m"]],[["把水银柱高度用厘米数直接当米代入。","0.76 m 水银柱给出约 1.01×10⁵ Pa；高度单位未统一会造成显著偏差。"],["认为大气压只从上方作用，不会向各个方向传递。","静止气体压强向各方向作用，覆杯实验、吸盘等现象都能体现大气压的作用。"]],"大气压随高度、天气和测量环境变化；标准大气压约为 1.01×10⁵ Pa。水银柱高度必须竖直测量，不能把容器形状误认为决定压强的因素。用液柱估算大气压属于受压液柱的定量拓展，初中核心还包括覆杯实验、吸盘和气压变化现象。",["水银柱静止时，液柱重量对下方截面产生压强。","按液体压强关系 p=ρ·g·h，以水银密度和竖直高度估算。","将所得值与约 1.01×10⁵ Pa 的标准大气压数量级比较，并说明实际大气压会变化。"],["水银柱高 0.76 m，水银密度取 13600 kg/m³，g=9.8 N/kg，估算大气压。",["确认水银柱高度已用米表示。","p=ρ·g·h=13600×9.8×0.76≈101293 Pa。"],"约 1.01×10⁵ Pa。"],["pressure-02"],["pressure-04"],["气体压强","大气压","水银柱","托里拆利实验","拓展"],8],["pressure-04","浮力","浸在液体或气体中的物体会受到竖直向上的浮力。",[["流体密度和排开体积求浮力","\u003cmrow>\u003cmi mathvariant=\"normal\">Fb\u003c/mi>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmrow>\u003cmi>ρ\u003c/mi>&#x22C5;\u003cmi>g\u003c/mi>\u003c/mrow>&#x22C5;\u003cmi>V\u003c/mi>\u003c/mrow>\u003c/mrow>","V 是被排开的流体体积；物体完全浸没时 V 等于物体体积。"],["阿基米德原理的排液重力关系","\u003cmrow>\u003cmi mathvariant=\"normal\">Fb\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi mathvariant=\"normal\">Gd\u003c/mi>\u003c/mrow>","Gd 是物体排开的液体或气体所受的重力。"]],[["Fb","物体受到的浮力","N"],["ρ","液体密度","kg/m³"],["g","当地重力加速度","N/kg"],["V","物体排开液体的体积","m³"],["Gd","排开液体所受的重力","N"],["G","物体所受重力","N"]],[["把阿基米德原理中的排开体积误换成物体的总体积。","浮力由排开液体体积决定；完全浸没时排开体积等于物体体积，部分浸入时则小于总体积。"],["认为浮力只作用于漂浮物体。","浸没在液体中的石块也受到浮力；只要物体浸在流体中，就应分析浮力。"]],"计算浮力时用排开流体的体积，不一定等于物体总体积：物体部分浸入时只取浸入部分。浮力方向竖直向上；同一流体中排开体积越大，浮力越大。称重法、阿基米德原理和排液重力比较可以作为不同测量路径。浮沉状态还需单独比较浮力与重力。",["浮力来自液体对物体上下表面的压力差，方向竖直向上。","阿基米德原理把浮力与排开流体的重力相联系。","排开液体质量可由密度乘排开体积得到，再乘 g 得其重力。","物体漂浮或悬浮静止时，竖直方向合力为零，故浮力等于物体重力。"],["一个物体浸没在水中并排开 0.003 m³ 的水，取水密度 1000 kg/m³、g=10 N/kg，求浮力。",["确认使用排开液体体积 V=0.003 m³。","Fb=ρ·g·V=1000×10×0.003=30 N。"],"浮力为 30 N。"],["pressure-02"],["pressure-05"],["浮力","阿基米德原理","排开液体体积","排液重力"],8],["pressure-05","物体的浮与沉","物体浸入液体后，运动状态由浮力、重力和初始状态共同决定。",[["漂浮或悬浮时的力平衡","\u003cmrow>\u003cmi mathvariant=\"normal\">Fb\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi>G\u003c/mi>\u003c/mrow>","物体处于静止漂浮或悬浮状态，合力为零。"]],[["Fb","物体受到的浮力","N"],["G","物体所受重力","N"],["Gd","排开液体所受的重力","N"],["ρ","液体密度","kg/m³"],["g","重力加速度","N/kg"],["V","物体排开液体体积","m³"]],[["把下沉物体也一律按漂浮平衡处理。","漂浮或悬浮静止时 Fb=G；下沉加速时通常重力大于浮力，不能用平衡关系代替。"],["把“漂浮”和“悬浮”理解成浮力方向不同。","两种状态下浮力都竖直向上；区别是物体处于液面还是浸没在液体内部。"]],"判断浮沉先明确物体是否浸没，再比较浮力与重力：静止漂浮或悬浮时两力平衡；下沉加速时重力大于浮力；上浮时浮力大于重力。密度比较可帮助判断常见情境，但要注意空心、内部气体和形状对平均密度的影响。",["画出物体所受的重力和浮力，确认它们方向相反。","静止漂浮或悬浮时合力为零，因此浮力大小等于重力大小。","运动中则比较两力大小判断加速度方向；不要把平衡条件套用于下沉加速过程。"],["某木块漂浮在水面，重力为 3 N，求它受到的浮力。",["漂浮状态稳定，木块处于平衡。","因此浮力大小等于重力，Fb=3 N。"],"浮力为 3 N。"],["pressure-04"],[],["物体的浮与沉","漂浮","悬浮","下沉","浮力与重力"],8],["particle-01","走进分子世界","常见物质由大量分子构成，分子很小，肉眼无法直接观察；分子永不停息地做无规则运动，温度越高通常运动越剧烈。",[["米换算为纳米","\u003cmrow>\u003cmsub>\u003cmi>d\u003c/mi>\u003cmi mathvariant=\"normal\">nm\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmn>1000000000\u003c/mn>&#x2062;\u003cmsub>\u003cmi>d\u003c/mi>\u003cmi>m\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/mrow>","1 m=10⁹ nm；两种数值表示同一长度。"],["纳米换算为米","\u003cmrow>\u003cmsub>\u003cmi>d\u003c/mi>\u003cmi>m\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmsub>\u003cmi>d\u003c/mi>\u003cmi mathvariant=\"normal\">nm\u003c/mi>\u003c/msub>\u003cmn>1000000000\u003c/mn>\u003c/mfrac>\u003c/mrow>","原长度用 nm 表示，换算结果用 m 表示。"]],[["d\u003csub>m\u003c/sub>","以米表示的微观长度","m"],["d\u003csub>nm\u003c/sub>","同一长度以纳米表示","nm"]],[["把米换算成纳米时只乘 1000，误把毫、微等前缀混淆。","米到纳米相差 10⁹ 倍；例如 10⁻¹⁰ m 应为 0.1 nm，而不是 10⁻⁷ nm。"],["把分子或原子的示意图当作按真实尺寸比例绘制的结构图。","微观结构图通常为便于辨认而放大或简化，不能直接据图比较真实粒子尺寸。"]],"不同物质彼此接触后会逐渐混合，这种扩散现象支持分子在不停运动的认识。扩散速度还受温度、状态和颗粒尺度等因素影响，不能仅由一个简单比例式预测。纳米与米的换算可帮助描述分子尺度，但不表示每个分子直径都恰为某一固定值。",["物质的粒子尺度远小于日常物体，表示时常使用纳米。","米和纳米都是长度单位，1 m=1 000 000 000 nm。","乘以或除以单位换算比例，可在 m 与 nm 之间转换。"],["某微观长度约为 0.2 nm，换算成米。",["1 nm=10⁻⁹ m。","0.2 nm=0.2×10⁻⁹ m=2×10⁻¹⁰ m。"],"约为 2×10⁻¹⁰ m。"],[],["particle-02"],["分子","分子运动","扩散","分子间隙","纳米"],9],["particle-03","静电现象","物体因电子转移或电荷重新分布而带电，带电物体之间会发生吸引或排斥。",[["绝缘系统总电荷守恒","\u003cmrow>\u003cmsub>\u003cmi>Q\u003c/mi>\u003cmi mathvariant=\"normal\">总\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmsub>\u003cmi>Q\u003c/mi>\u003cmi>A\u003c/mi>\u003c/msub>\u003cmo>+\u003c/mo>\u003cmsub>\u003cmi>Q\u003c/mi>\u003cmi>B\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/mrow>","把所有相关带电物体纳入系统，且系统与外界没有电荷交换；电荷量保留正负号。"],["由守恒总电荷反求B物体电荷","\u003cmrow>\u003cmsub>\u003cmi>Q\u003c/mi>\u003cmi>B\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmsub>\u003cmi>Q\u003c/mi>\u003cmi mathvariant=\"normal\">总\u003c/mi>\u003c/msub>\u003cmo>−\u003c/mo>\u003cmsub>\u003cmi>Q\u003c/mi>\u003cmi>A\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/mrow>","绝缘系统只含物体 A 和 B，电荷量采用带正负号的库仑值。"]],[["Q\u003csub>A\u003c/sub>","系统内物体 A 的带符号电荷量","C"],["Q\u003csub>B\u003c/sub>","系统内物体 B 的带符号电荷量","C"],["Q\u003csub>总\u003c/sub>","绝缘系统总电荷量","C"]],[["摩擦起电时把转移电荷误认为在系统内被创造出来。","电荷量应按符号作代数和；两物体带等量异号电荷时总电荷为零。应结合电荷守恒和本节讨论范围判断。"],["认为同种电荷相吸、异种电荷相斥。","同种电荷相互排斥，异种电荷相互吸引；应通过带电体实验辨认。应结合电荷守恒和本节讨论范围判断。"]],"摩擦起电不是凭空创造电荷，而是电子从一个物体转移到另一个物体；因此一个物体带正电时，另一个物体可能带等量负电。验电器可显示物体是否带电，但不直接给出电荷量大小。本点的电荷和守恒关系是定量拓展，初中核心是观察带电现象及相互作用。",["把相互作用的带电物体划入同一系统，逐个记录电荷的正负号。","电子转移只改变电荷分布，孤立系统的总电荷不变。","把系统总电荷写成各物体带符号电荷的代数和，检查转移前后总量一致。"],["绝缘系统中物体 A 带 +5×10⁻⁸ C，系统总电荷为 +2×10⁻⁸ C，求物体 B 的电荷量。",["用 Q\u003csub>总\u003c/sub>=Q\u003csub>A\u003c/sub>+Q\u003csub>B\u003c/sub>。","Q\u003csub>B\u003c/sub>=2×10⁻⁸-5×10⁻⁸=-3×10⁻⁸ C。"],"物体 B 带 -3×10⁻⁸ C。"],[],["particle-04"],["静电现象","电荷","摩擦起电","电荷守恒","拓展"],9],["particle-04","探索更小的微粒","物质还可继续分为原子、原子核和更小的粒子，原子并非不可再分。",[["原子与原子核的代表尺度比","\u003cmrow>\u003cmsub>\u003cmi>d\u003c/mi>\u003cmi mathvariant=\"normal\">atom\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmn>100000\u003c/mn>&#x2062;\u003cmsub>\u003cmi>d\u003c/mi>\u003cmi mathvariant=\"normal\">nucleus\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/mrow>","仅比较典型数量级，原子尺度约 10⁻¹⁰ m、原子核约 10⁻¹⁵ m；不是精确适用于每种原子的尺寸定律。"],["由代表原子尺度反推原子核尺度","\u003cmrow>\u003cmsub>\u003cmi>d\u003c/mi>\u003cmi mathvariant=\"normal\">nucleus\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmsub>\u003cmi>d\u003c/mi>\u003cmi mathvariant=\"normal\">atom\u003c/mi>\u003c/msub>\u003cmn>100000\u003c/mn>\u003c/mfrac>\u003c/mrow>","沿用原子约为原子核 10⁵ 倍的数量级估计。"]],[["d\u003csub>atom\u003c/sub>","原子直径的代表尺度","nm"],["d\u003csub>nucleus\u003c/sub>","原子核直径的代表尺度","nm"]],[["把原子与原子核的尺度差误写成 10 倍。","典型尺度约差五个数量级；原子核约 10⁻¹⁵ m，原子约 10⁻¹⁰ m。"],["认为原子是不可再分的最小粒子。","原子由原子核和核外电子构成，原子核还具有更细的内部结构；科学认识随证据发展。"]],"从分子到原子、原子核和更小粒子的认识来自实验与模型不断发展。用代表尺度比较可看出原子核远小于原子，但这些数值是数量级估计，不是每种原子都完全相同的精确尺寸。不能把科学模型误读成肉眼可见的实体图，也不能把“更小”误认为质量和结构相同。",["选取原子和原子核的代表性直径数量级，分别约为 10⁻¹⁰ m 和 10⁻¹⁵ m。","两尺度相除得到约 10⁵ 的数量级差别。","该比值用作尺度比较，不应误称为对所有原子都精确不变的常数。"],["按原子直径约 10⁻¹⁰ m、原子核直径约 10⁻¹⁵ m 估算，二者尺度相差多少倍？",["计算尺度比 10⁻¹⁰÷10⁻¹⁵。","指数相减得到 10⁵。"],"原子直径约为原子核的 10⁵ 倍。"],["particle-01"],["particle-05"],["原子","原子核","更小微粒","尺度","数量级","拓展"],9],["particle-05","日心说与太阳系","日心说以太阳为太阳系中心，解释地球和其他行星绕太阳运行的观测现象。",[["圆轨道近似下的平均轨道速度","\u003cmrow>\u003cmi>v\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmrow>\u003cmn>2\u003c/mn>&#x2062;\u003cmi>π\u003c/mi>\u003c/mrow>&#x22C5;\u003cmi>r\u003c/mi>\u003c/mrow>\u003cmi>T\u003c/mi>\u003c/mfrac>\u003c/mrow>","把行星轨道近似为圆，r 为圆轨道半径、T 为周期；所得为平均轨道速度估算。"],["由圆轨道周长和平均速度求周期","\u003cmrow>\u003cmi>T\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmrow>\u003cmn>2\u003c/mn>&#x2062;\u003cmi>π\u003c/mi>\u003c/mrow>&#x22C5;\u003cmi>r\u003c/mi>\u003c/mrow>\u003cmi>v\u003c/mi>\u003c/mfrac>\u003c/mrow>","沿用圆轨道近似，轨道周长为 2·π·r。"]],[["v","行星平均轨道速度","m/s"],["r","近似圆轨道半径","m"],["T","行星绕日运行周期","s"]],[["把轨道周长误写成半径乘周期，再用于求速度。","圆周长是 2·π·r；漏掉因子 2 会把估算轨道速度减半。"],["认为日心说把太阳放在整个宇宙的中心。","日心说讨论的是太阳系结构，并非宣称太阳是整个宇宙的中心。应结合电荷守恒和本节讨论范围判断。"]],"科学模型根据观测证据建立，并会随着新证据修正。把行星轨道近似为圆时，可用轨道周长除以周期估算平均轨道速度；该简化公式不等于精确轨道理论，也不单独证明日心说。比较地心、日心模型时要区分模型解释力与历史结论。",["圆轨道一周的路径长度为 2·π·r。","平均速度等于一周路程除以周期，得到 v=2·π·r/T。","真实行星轨道为椭圆，圆轨道公式仅用于简化的数量级估算。"],["把地球轨道近似成半径 1.50×10¹¹ m 的圆，周期取 3.16×10⁷ s，估算平均轨道速度。",["圆轨道周长约为 2·π·r。","v=2·π·r/T≈3.0×10⁴ m/s。"],"约为 3.0×10⁴ m/s。"],[],["particle-02"],["日心说","太阳系","行星轨道","模型","拓展"],9],["particle-02","宇宙探秘","宇宙包含恒星、行星、星系等不同尺度的天体系统，观测遥远天体时接收到的是它们过去发出的光。",[["光在给定时间内传播的距离","\u003cmrow>\u003cmi>s\u003c/mi>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmi>c\u003c/mi>&#x22C5;\u003cmi>t\u003c/mi>\u003c/mrow>\u003c/mrow>","光速近似取 3.0×10⁸ m/s，时间 t 用秒；一年按 365 d 估算。"],["由光程和光速求传播时间","\u003cmrow>\u003cmi>t\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmi>s\u003c/mi>\u003cmi>c\u003c/mi>\u003c/mfrac>\u003c/mrow>","距离 s 与真空光速 c 采用相同的光传播路径。"]],[["s","光在给定时间内传播的距离","m"],["c","真空中的光速近似值","m/s"],["t","光传播时间，以秒计","s"],["d\u003csub>m\u003c/sub>","以米表示的微观长度","m"],["d\u003csub>nm\u003c/sub>","同一长度以纳米表示","nm"]],[["把光速 300 000 km/s 的数值直接当作 m/s 使用。","300 000 是 km/s；换成 m/s 应为 300 000 000。直接使用会少算 1000 倍。"],["将光年当成时间单位，而不是光在一年内走过的距离。","“一年”是定义中采用的传播时间，“光年”最终表示一段距离；量纲为长度。"]],"比较天体距离时，先分清“光走了多久”和“走过多远”。光速可近似取 3.0×10⁸ m/s；以年为时间单位时要换算秒数，再将光程表示为米或光年。宇宙结构和观测证据要结合模型理解，不能把日心说与宇宙起源问题混为一谈。",["光年是长度单位，定义为光在一年内传播的距离。","一年按 365 d 换算为 31 536 000 s。","用光速乘以秒数，得到一光年约 9.46×10¹⁵ m。"],["按一年 365 d、光速 3.0×10⁸ m/s 估算一光年。",["一年为 365×24×3600=31 536 000 s。","s=ct=3.0×10⁸×31 536 000≈9.46×10¹⁵ m。"],"一光年约为 9.46×10¹⁵ m。"],["particle-01","light-01"],[],["宇宙","恒星","星系","光年","光速"],9],["machine-01","杠杆","杠杆是在力的作用下绕固定点转动的硬棒。",[["杠杆平衡条件","\u003cmrow>\u003cmi mathvariant=\"normal\">F1\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi mathvariant=\"normal\">F2\u003c/mi>&#x22C5;\u003cmi mathvariant=\"normal\">l2\u003c/mi>\u003c/mrow>\u003cmi mathvariant=\"normal\">l1\u003c/mi>\u003c/mfrac>\u003c/mrow>","杠杆静止平衡，l1、l2 是到支点的垂直力臂。"],["由动力和力臂求平衡阻力","\u003cmrow>\u003cmi mathvariant=\"normal\">F2\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmi mathvariant=\"normal\">F1\u003c/mi>&#x22C5;\u003cmi mathvariant=\"normal\">l1\u003c/mi>\u003c/mrow>\u003cmi mathvariant=\"normal\">l2\u003c/mi>\u003c/mfrac>\u003c/mrow>","已知动力、动力臂和非零阻力臂，杠杆处于平衡。"]],[["F1","动力大小","N"],["l1","动力臂长度","m"],["F2","阻力大小","N"],["l2","阻力臂长度","m"]],[["把杠杆平衡条件写成动力与阻力直接相等。","平衡条件需要比较力与力臂的乘积；剪刀情境中动力应为 20 N，不能再多除以 2。"],["把杠杆两端到支点的任意距离当成力臂。","力臂是支点到力的作用线的垂直距离；不一定等于杠杆上沿的长度。"]],"杠杆平衡条件可用于分析撬棒、剪刀和天平。先找支点，再确定力的作用线并作垂线段得到力臂；力臂不是支点到作用点的任意距离。改变动力臂或阻力臂会改变平衡所需的力，但不能凭杠杆长短直接判断省力。",["从支点到动力作用线作垂线，得到动力臂 l1。","从支点到阻力作用线作垂线，得到阻力臂 l2。","杠杆静止平衡时，两侧力与各自力臂的乘积相等。","根据已知的三个量，可解出第四个量。"],["撬棒阻力为 200 N，阻力臂为 0.1 m，动力臂为 1 m，求杠杆平衡所需动力。",["F1=F2·l2/l1。","F1=200×0.1÷1=20 N。"],"动力为 20 N。"],["force-01"],["machine-02"],["杠杆","支点","力臂","杠杆平衡条件"],10],["machine-04","滑轮","定滑轮主要改变用力方向，理想情况下不省力；动滑轮可省力但需要拉动更长距离。",[["理想动滑轮的拉力关系","\u003cmrow>\u003cmsub>\u003cmi>F\u003c/mi>\u003cmi mathvariant=\"normal\">pull\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmsub>\u003cmi>G\u003c/mi>\u003cmi mathvariant=\"normal\">load\u003c/mi>\u003c/msub>\u003cmn>2\u003c/mn>\u003c/mfrac>\u003c/mrow>","单个理想动滑轮匀速提升重物，忽略滑轮自重、绳重和摩擦。"],["理想动滑轮的距离关系","\u003cmrow>\u003cmsub>\u003cmi>s\u003c/mi>\u003cmi mathvariant=\"normal\">pull\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmn>2\u003c/mn>&#x2062;\u003cmsub>\u003cmi>h\u003c/mi>\u003cmi mathvariant=\"normal\">load\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/mrow>","理想单动滑轮由两段绳承担重物，忽略绳伸长和摩擦。"]],[["F\u003csub>pull\u003c/sub>","拉绳所需的拉力","N"],["G\u003csub>load\u003c/sub>","被提升物体所受重力","N"],["s\u003csub>pull\u003c/sub>","自由端绳子移动的距离","m"],["h\u003csub>load\u003c/sub>","重物上升的高度","m"],["W\u003csub>入\u003c/sub>","输入的功","J"],["W\u003csub>出\u003c/sub>","提升重物所做的有用功","J"]],[["使用理想动滑轮时只考虑省力，忘记拉绳距离也增加。","单动滑轮由两段绳承担重物，重物上升 1 m 时拉绳端约需移动 2 m。"],["认为实际滑轮组一定能省功。","实际装置有摩擦和自身质量，输入功通常大于有用功；机械可以省力但不能省功。"]],"分析滑轮时先数承担动滑轮和重物的绳段，再判断每段绳的拉力与物体重力的关系。理想动滑轮省一半力时，拉绳距离约为重物上升高度的两倍，输入功与输出功相等；实际装置因摩擦等损耗，总输入功大于有用功。",["先判断使用定滑轮、动滑轮还是滑轮组，画出承重绳段。","理想动滑轮中两段绳平均承担重物重力，所以拉力约为重力的一半。","省力伴随距离增加；比较拉力乘绳端路程与重力乘重物上升高度，理想情况下两者相等。"],["用理想动滑轮提升 200 N 重物 0.5 m，求拉力和拉绳距离。",["理想单动滑轮由两段绳承重，拉力约为 200÷2=100 N。","拉绳距离约为 2×0.5=1.0 m。","输入功为 100×1.0=100 J，等于重物增加的有用功 200×0.5=100 J。"],"拉力约 100 N，拉绳距离约 1.0 m。"],["machine-01"],["machine-02"],["滑轮","定滑轮","动滑轮","滑轮组","机械效率"],10],["machine-02","功","功描述力对物体做功的过程。",[["力和沿力方向距离求功","\u003cmrow>\u003cmi>W\u003c/mi>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmi>F\u003c/mi>&#x22C5;\u003cmi>s\u003c/mi>\u003c/mrow>\u003c/mrow>","力与位移同方向，F 用 N、s 用 m。"]],[["F","沿运动方向的作用力","N"],["s","物体沿力方向通过的距离","m"],["W","力所做的功","J"],["t","做功所用时间","s"],["P","功率","W"]],[["位移已换算为 m 后，又按 cm 单位额外缩小 100 倍。","抬起物体的位移已按 4 m 代入，不能再除以 100；否则 200 J 会被算成 2 J。"],["把功写成力除以移动距离。","功等于力与沿力方向位移的乘积，不是除法；单位由 N×m 得到 J，位移方向与力垂直时该力不做功。"],["物体受力但没有沿力方向移动，仍认为该力做了功。","做功要求力对物体产生沿力方向的位移；只有力却没有相应位移，或物体运动方向与力垂直，都不能据此认为该力做了功。"]],"计算功时必须同时有力和沿力方向的位移：物体虽移动但力没有沿位移方向的分量时，不能直接用 W=Fs。力用 N、距离用 m，功的单位是 J。",["确认作用力是否使物体沿力的方向移动。","若力和位移同向，用 W=F·s 求功。","记录完成这段功所用的时间。","用 P=W/t 比较做功快慢。"],["用 100 N 的水平力拉木箱移动 2 m，历时 5 s，求功和功率。",["W=Fs=100×2=200 J。","P=W/t=200/5=40 W。"],"做功 200 J，功率 40 W。"],["motion-01"],["machine-03"],["功","力","位移","焦耳"],10],["machine-05","功率","功率表示做功的快慢，等于一段过程中所做的功与所用时间之比。",[["由功和时间求功率","\u003cmrow>\u003cmi>P\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmi>W\u003c/mi>\u003cmi>t\u003c/mi>\u003c/mfrac>\u003c/mrow>","W 是同一时间段内完成的功，t 大于零；功率单位为 W。"]],[["F","沿运动方向的作用力","N"],["s","物体沿力方向通过的距离","m"],["W","力所做的功","J"],["t","做功所用时间","s"],["P","功率","W"]],[["把功率误算成做功除以两倍时间。","功率是单位时间内完成的功；把时间额外加倍会使结果减半。计算前应写出功、时间和功率各自的物理意义。"],["把功率和总功混为一谈，只比较做功总量。","功率描述做功快慢；相同的功用时不同，功率就不同。计算前应写出功、时间和功率各自的物理意义。"],["物体受力但没有沿力方向移动，仍认为该力做了功。","做功要求力对物体产生沿力方向的位移；只有力却没有相应位移，或物体运动方向与力垂直，都不能据此认为该力做了功。"]],"比较机器做功快慢时要比较功率，而不是只看总功。计算时功用 J、时间用 s，功率单位为 W；大型设备也常用 kW。功率是单位时间完成的功，数值并不等于总功；功率换算时 1 kW=1000 W，不能漏写时间单位。",["确定研究的做功过程及对应时间间隔 t。","用功除以完成该功所用的时间，得到平均功率 P=W/t。","把功统一为 J、时间统一为 s，功率结果即为 W。"],["机器在 5 s 内完成 200 J 的功，求平均功率。",["使用 P=W/t。","P=200/5=40 W。"],"平均功率为 40 W。"],["machine-02"],["machine-03"],["功率","做功快慢","功","时间","瓦特"],10],["machine-03","机械效率","机械效率表示有用功占总输入功的比例，等于有用功与总功之比。",[["有用功与总功求机械效率","\u003cmrow>\u003cmi>η\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmsub>\u003cmi>W\u003c/mi>\u003cmi mathvariant=\"normal\">use\u003c/mi>\u003c/msub>\u003cmsub>\u003cmi>W\u003c/mi>\u003cmi mathvariant=\"normal\">入\u003c/mi>\u003c/msub>\u003c/mfrac>\u003c/mrow>","有用功不大于总功；机械效率用小数表示时乘 100% 可换为百分数。"],["由效率和总功求有用功","\u003cmrow>\u003cmsub>\u003cmi>W\u003c/mi>\u003cmi mathvariant=\"normal\">use\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmi>η\u003c/mi>&#x22C5;\u003cmsub>\u003cmi>W\u003c/mi>\u003cmi mathvariant=\"normal\">入\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/mrow>","η 用 0 到 1 之间的小数表示。"]],[["W\u003csub>use\u003c/sub>","完成任务的有用功","J"],["W\u003csub>入\u003c/sub>","输入机械的总功","J"],["η","机械效率，以小数表示","1"]],[["把总功除以有用功当作机械效率。","效率应为有用功占输入总功的比例；提升重物情境中正确值 0.8，反过来会得到 1.25。"],["认为机械效率可以大于 100%，或把效率与功率混为一谈。","实际机械有能量损失，有用功不能超过输入总功；功率是功与时间之比，与效率概念不同。"]],"使用滑轮或斜面时，先判断对目标有帮助的功是有用功，其余输入功构成总功。效率提高表示损失比例降低，并不意味着输入功一定减少或机械一定省力。计算前要让有用功和总功采用相同单位；效率不能写成超过 100% 的数值。",["分清有用功和输入的总功。","用有用功除以总功得到效率小数。","将小数乘 100% 可换为百分数。","实际摩擦和其他损耗使有用功小于输入总功。"],["滑轮组输入总功 200 J，提升重物的有用功为 150 J，求机械效率。",["η=150/200=0.75。","换成百分数为 75%。"],"机械效率为 75%。"],["machine-02"],[],["机械效率","有用功","总功","能量损失"],10],["energy-01","机械能","物体由于运动而具有动能，由于被举高而具有重力势能；动能和重力势能之和称为机械能。",[["物体动能","\u003cmrow>\u003cmi mathvariant=\"normal\">Ek\u003c/mi>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmrow>\u003cmn>0.5\u003c/mn>&#x2062;\u003cmi>m\u003c/mi>\u003c/mrow>&#x22C5;\u003cmsup>\u003cmi>v\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003c/mrow>\u003c/mrow>","适用于物体平动的动能计算，m 用 kg、v 用 m/s。"],["物体重力势能","\u003cmrow>\u003cmi mathvariant=\"normal\">Ep\u003c/mi>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmrow>\u003cmi>m\u003c/mi>&#x22C5;\u003cmi>g\u003c/mi>\u003c/mrow>&#x22C5;\u003cmi>h\u003c/mi>\u003c/mrow>\u003c/mrow>","h 从选定参考面竖直量起，g 取当地值。"],["动能和重力势能组成机械能","\u003cmrow>\u003cmi mathvariant=\"normal\">Em\u003c/mi>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmi mathvariant=\"normal\">Ek\u003c/mi>\u003cmo>+\u003c/mo>\u003cmi mathvariant=\"normal\">Ep\u003c/mi>\u003c/mrow>\u003c/mrow>","本式中的机械能只计动能与重力势能，参考高度须一致。"],["由速度和高度直接求机械能","\u003cmrow>\u003cmi mathvariant=\"normal\">Em\u003c/mi>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmrow>\u003cmrow>\u003cmn>0.5\u003c/mn>&#x2062;\u003cmi>m\u003c/mi>\u003c/mrow>&#x22C5;\u003cmsup>\u003cmi>v\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>\u003c/mrow>\u003cmo>+\u003c/mo>\u003cmrow>\u003cmrow>\u003cmi>m\u003c/mi>&#x22C5;\u003cmi>g\u003c/mi>\u003c/mrow>&#x22C5;\u003cmi>h\u003c/mi>\u003c/mrow>\u003c/mrow>\u003c/mrow>","同一物体相对同一参考面计重力势能，机械能只包含动能和重力势能。"]],[["m","物体质量","kg"],["v","物体速度大小","m/s"],["Ek","物体动能","J"],["g","当地重力加速度","N/kg"],["h","相对选定参考面的高度","m"],["Ep","物体重力势能","J"],["Em","物体机械能，等于动能和重力势能之和","J"],["Q","物体吸收的热量","J"],["c\u003csub>h\u003c/sub>","物质比热容","J/kg/℃"],["dT","物体升高的温度","℃"]],[["写动能公式时漏掉系数二分之一，只保留质量乘速度平方。","高处小球的动能为 0.5×2×3²=9 J；漏掉二分之一会得到 18 J，量纲仍正确但数值翻倍。"],["把动能写成质量与速度的一次方相乘，漏掉速度平方和二分之一。","动能的单位应为 J，m·v 的单位是 kg·m/s；量纲与数值关系都不符。"],["认为物体高度变化时重力势能与参考面无关。","重力势能数值依赖所选零势能参考面；比较同一过程能量变化时要保持参考面一致。"]],"动能随速度增大而增大，重力势能随所选参考面以上高度增大而增大。机械能在运动和相互作用中可以相互转化；只有在适用条件满足时，机械能才守恒。计算重力势能时要说明参考面，不能把任意零高度说成绝对位置。",["物体运动时具有动能，计算时使用质量和速度。","相对参考面被举高的物体具有重力势能，计算时使用质量、g 和高度。","把动能与重力势能相加，得到该参考面下的机械能。","分析能量转化时，检查摩擦等因素是否使机械能转化为内能。"],["质量 2 kg 的小球以 3 m/s 运动，并位于参考面上方 5 m，取 g=10 N/kg，求机械能。",["动能 Ek=0.5×2×3²=9 J。","重力势能 Ep=2×10×5=100 J。","机械能 Em=9+100=109 J。"],"机械能为 109 J。"],["motion-01","force-01"],["energy-02"],["机械能","动能","重力势能","机械能转化"],11],["energy-03","内能 热传递","物体内部所有分子无规则运动的动能及分子相互作用势能的总和称为内能。",[["绝热热交换中的放热吸热平衡","\u003cmrow>\u003cmsub>\u003cmi>Q\u003c/mi>\u003cmi mathvariant=\"normal\">lost\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmsub>\u003cmi>Q\u003c/mi>\u003cmi mathvariant=\"normal\">gained\u003c/mi>\u003c/msub>\u003c/mrow>","把参与热交换的物体作为近似绝热系统，忽略向环境、容器等散失的能量。"]],[["Q\u003csub>lost\u003c/sub>","高温物体放出的热量大小","J"],["Q\u003csub>gained\u003c/sub>","低温物体吸收的热量","J"],["c\u003csub>h\u003c/sub>","被加热物质的比热容","J/kg/℃"],["m","被加热物质质量","kg"],["dT","被加热物质的温升","℃"]],[["在忽略散热的热平衡问题中把吸热量误写成放热量的两倍。","封闭近似绝热系统的能量账目应相等；额外乘 2 会破坏热量平衡。"],["认为热量是物体本身储存的一种物质。","热量描述热传递过程中转移的能量；物体具有内能，而不是“含有热量”。"]],"热量是热传递过程中传递的能量，不是物体“含有”的一种物质。忽略与外界的能量交换和散失时，高温物体放出的热量等于低温物体吸收的热量；实际实验需要考虑容器、温度计和环境带走的能量。用水的比热容可估算吸热量，再与热平衡的能量账目核对。",["确定热交换系统边界，并判断是否可近似忽略向环境散热。","记录高温物体放热量和低温物体吸热量的大小。","在近似绝热的系统内，两者大小相等；实际实验可将差值视作热损失与测量误差分析。"],["忽略散热时，一块热金属放出 600 J 热量给水，水吸收多少热量？",["把金属和水作为近似绝热系统。","金属放出的热量等于水吸收的热量。"],"水吸收约 600 J。"],["energy-01"],["energy-02","energy-04"],["内能","热传递","吸热","放热","热平衡"],11],["energy-02","物质的比热容","比热容表示单位质量的某种物质温度升高或降低 1℃ 时吸收或放出的热量。",[["加热温度变化时的吸热量","\u003cmrow>\u003cmi>Q\u003c/mi>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmrow>\u003cmsub>\u003cmi>c\u003c/mi>\u003cmi>h\u003c/mi>\u003c/msub>&#x22C5;\u003cmi>m\u003c/mi>\u003c/mrow>&#x22C5;\u003cmi mathvariant=\"normal\">dT\u003c/mi>\u003c/mrow>\u003c/mrow>","无物态变化、比热容近似不变，dT 为温升，单位 ℃。"],["由吸热量求比热容","\u003cmrow>\u003cmsub>\u003cmi>c\u003c/mi>\u003cmi>h\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmi>Q\u003c/mi>\u003cmrow>\u003cmi>m\u003c/mi>&#x22C5;\u003cmi mathvariant=\"normal\">dT\u003c/mi>\u003c/mrow>\u003c/mfrac>\u003c/mrow>","样品无物态变化，吸收热量 Q、质量 m 和温升 dT 已知。"]],[["Q","物体吸收的热量","J"],["c\u003csub>h\u003c/sub>","物质比热容","J/kg/℃"],["m","物体质量","kg"],["dT","物体升高的温度","℃"]],[["计算吸热量时漏掉物体质量。","比热容描述单位质量的吸热量，整块物体还要乘质量；半千克水升温 10℃ 吸热 21 000 J。"],["用末温代替温升，并在温度不变或发生物态变化时直接套用本式。","本式需要温度变化量，且适用于比热容近似不变、没有物态变化的过程；相变时需另行分析。"]],"水的比热容约为 4200 J/kg/℃，表示 1 kg 水升高 1℃ 约需吸收 4200 J。用 Q=c\u003csub>h\u003c/sub>·m·dT 计算时，先确认过程没有发生物态变化，并把质量、温升和热量单位统一。比热容是物质特性，不等于一整份物体吸收的热量。",["记录被加热物体质量 m 和比热容 c\u003csub>h\u003c/sub>。","测量加热前后温度，求温升 dT。","在无物态变化条件下，用 Q=c\u003csub>h\u003c/sub>·m·dT 求吸收热量。","实验中还要考虑容器吸热和散热等误差来源。"],["0.5 kg 的水温度升高 10℃，水的比热容取 4200 J/kg/℃，求吸收热量。",["Q=c\u003csub>h\u003c/sub>·m·dT。","Q=4200×0.5×10=21 000 J。"],"水吸收 21 000 J 热量。"],["state-01"],[],["比热容","热量","质量","温度变化"],11],["energy-04","机械能与内能的相互转化","机械能可以转化为内能，内能也可通过做功等过程转化为机械能。",[["机械能减少转化为内能","\u003cmrow>\u003cmsub>\u003cmi>E\u003c/mi>\u003cmi mathvariant=\"normal\">机械前\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmsub>\u003cmi>E\u003c/mi>\u003cmi mathvariant=\"normal\">机械后\u003c/mi>\u003c/msub>\u003cmo>+\u003c/mo>\u003cmsub>\u003cmi>E\u003c/mi>\u003cmi mathvariant=\"normal\">内能增\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/mrow>","把刹车或摩擦过程中的相关物体作为系统，忽略向外界的能量散失。"],["由前后机械能差求内能增量","\u003cmrow>\u003cmsub>\u003cmi>E\u003c/mi>\u003cmi mathvariant=\"normal\">内能增\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmsub>\u003cmi>E\u003c/mi>\u003cmi mathvariant=\"normal\">机械前\u003c/mi>\u003c/msub>\u003cmo>−\u003c/mo>\u003cmsub>\u003cmi>E\u003c/mi>\u003cmi mathvariant=\"normal\">机械后\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/mrow>","机械能减少量全部转化为系统内能，忽略热量散失和其他能量形式。"]],[["E\u003csub>mech\u003c/sub>_before","转化前机械能","J"],["E\u003csub>mech\u003c/sub>_after","转化后机械能","J"],["E\u003csub>int\u003c/sub>_gain","转化增加的内能","J"]],[["把机械能减少量的符号写反，导致内能减少。","本情境机械能从 100 J 降至 80 J，减少量为 20 J，转化为内能应为正的 20 J。"],["认为机械能减少就意味着能量消失。","摩擦可使机械能转化为内能；把系统边界和其他能量形式计入后，能量总量仍守恒。"]],"刹车片发热、双手摩擦后变热，说明机械能可转化为内能；热机中气体膨胀推动活塞，则内能可转化为机械能。只研究机械能时会观察到它减少，但把内能等形式也计入后能量账目仍平衡。分析前先划定系统，确认是否有外界能量输入或散失。",["选定系统并记录转化前机械能和转化后机械能。","若机械能减少全部进入系统内能，则内能增加量等于机械能减少量。","把末态机械能和内能增量相加，与初态机械能核对；有外界散热时应补记散失能量。"],["刹车前汽车机械能为 5000 J，刹车后为 4200 J，忽略向外界散热，求转化增加的内能。",["机械能减少量为 5000-4200=800 J。","忽略散热时，减少的机械能转化为内能。"],"内能增加约 800 J。"],["energy-01","energy-03"],[],["机械能转化","内能","摩擦生热","能量守恒"],11],["circuit-03","初识家用电器和电路 · 电路连接方式","家用电器把电能转化为光、热、声或机械能；简单电路由电源、用电器、开关和导线组成。",[["串联电路各处电流相等","\u003cmrow>\u003cmi mathvariant=\"normal\">I1\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi mathvariant=\"normal\">I2\u003c/mi>\u003c/mrow>","元件串联且电路稳定工作，各处没有分支。"],["并联干路电流","\u003cmrow>\u003cmi mathvariant=\"normal\">It\u003c/mi>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmi mathvariant=\"normal\">I1\u003c/mi>\u003cmo>+\u003c/mo>\u003cmi mathvariant=\"normal\">I2\u003c/mi>\u003c/mrow>\u003c/mrow>","干路总电流等于并联各支路电流之和。"]],[["I1","串联电路第一处电流","A"],["I\u003csub>mean\u003c/sub>","单位时间内通过导体横截面的电荷量所对应的电流","A"],["Q","通过导体横截面的电荷量","C"],["t","电荷通过导体横截面的时间","s"],["I2","串联第二处或并联第二支路的电流","A"],["It","并联电路干路总电流","A"],["U1","电路第一元件两端电压","V"],["U2","电路第二元件两端电压","V"],["Ut","电路总电压","V"],["U\u003csub>read\u003c/sub>","电压表读数","V"],["U\u003csub>range\u003c/sub>","电压表所选量程","V"],["n","仪表指针偏转格数","1"],["N","仪表满量程总格数","1"]],[["把并联干路电流误认为两支路电流的乘积。","并联支路汇流时干路电流等于各支路电流之和；0.2 A 和 0.3 A 合为 0.5 A。"],["认为家庭电路中的各用电器都串联，一个坏了全部熄灭。","家庭用电器通常并联接入，支路可独立工作；电路图要结合实际连接辨析。"]],"电路未闭合时通常没有持续电流；分析家用电器连接时可观察各元件是否能独立工作。串联支路的电流处处相等，并联干路电流由各支路电流汇合而成。这里把定性入门与电路连接合并呈现，避免给纯介绍性小节硬编公式。",["识别电源、用电器、开关和导线，判断电路是否闭合。","观察电流路径：首尾相连为串联，接在相同两节点之间为并联。","串联处电流相同；并联干路电流等于各支路电流之和，可与 Q/t 的电流定义交叉检查。"],["两支路电流分别为 0.2 A 和 0.3 A，求并联干路电流。",["识别为并联电路，干路电流等于支路电流之和。","It=0.2+0.3=0.5 A。"],"干路电流为 0.5 A。"],[],["circuit-01"],["家用电器","电路","串联","并联","电流路径"],12],["circuit-01","电流和电流表","电流表示电荷定向移动的快慢，等于单位时间内通过导体横截面的电荷量。",[["由电荷量和时间求电流","\u003cmrow>\u003cmsub>\u003cmi>I\u003c/mi>\u003cmi mathvariant=\"normal\">mean\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmi>Q\u003c/mi>\u003cmi>t\u003c/mi>\u003c/mfrac>\u003c/mrow>","Q 表示一段时间内通过导体横截面的电荷量，t 用秒，所得电流用安培。"],["电流表量程和指针格数求电流","\u003cmrow>\u003cmsub>\u003cmi>I\u003c/mi>\u003cmi mathvariant=\"normal\">read\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmsub>\u003cmi>I\u003c/mi>\u003cmi mathvariant=\"normal\">range\u003c/mi>\u003c/msub>&#x22C5;\u003cmi>n\u003c/mi>\u003c/mrow>\u003cmi>N\u003c/mi>\u003c/mfrac>\u003c/mrow>","指针式电流表按均匀刻度读取；所选量程记作 I量程，n 是偏转格数，N 是满量程格数。"]],[["I\u003csub>mean\u003c/sub>","单位时间内通过导体横截面的电荷量所对应的电流","A"],["Q","通过导体横截面的电荷量","C"],["t","电荷通过导体横截面的时间","s"],["I\u003csub>range\u003c/sub>","电流表所选量程","A"],["I\u003csub>read\u003c/sub>","电流表读数","A"],["n","指针偏转格数","1"],["N","满量程总格数","1"],["I1","串联电路第一处电流","A"],["I2","串联电路第二处电流","A"],["It","并联干路总电流","A"],["U1","第一元件两端电压","V"],["U2","第二元件两端电压","V"],["Ut","电路总电压","V"]],[["读电流表时把指针格数当成电流数值，未按量程换算。","读数应按量程乘偏转格数占满量程格数的比例；倒置比例会把读数放大。"],["将电流表误并联到电源两端。","电流表内阻很小，直接并联会形成近似短路并损坏仪表或电源。接线前要看清仪表符号和它的接入位置。"]],"电流用安培 A 表示。若使用指针式电流表，读数等于所选量程乘以指针格数与满量程格数之比；接入前估计电流并优先选择较大量程，再换到合适量程。电流表内阻很小，不可直接并联在电源两端。",["电流定义为单位时间内通过导体横截面的电荷量，得到 I=Q/t。","指针式电流表先读量程，再读偏转格数，按量程与满量程格数比例换算。","检查电流表应串联接入、电流方向正确且不超量程，读数写上 A。"],["电流表量程为 0.6 A，满量程 30 格，指针偏转 15 格，求读数。",["量程对应满量程 30 格。","I=0.6×15/30=0.30 A。"],"电流表读数为 0.30 A。"],[],["circuit-04"],["电流","电流表","电荷量","安培","电流读数"],12],["circuit-04","电压和电压表","电压表示推动电荷定向移动的作用，是形成电流的重要条件。",[["电压表量程和指针格数求电压","\u003cmrow>\u003cmsub>\u003cmi>U\u003c/mi>\u003cmi mathvariant=\"normal\">read\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmrow>\u003cmsub>\u003cmi>U\u003c/mi>\u003cmi mathvariant=\"normal\">range\u003c/mi>\u003c/msub>&#x22C5;\u003cmi>n\u003c/mi>\u003c/mrow>\u003cmi>N\u003c/mi>\u003c/mfrac>\u003c/mrow>","指针式电压表按均匀刻度读取；n 是指针格数，N 是满量程格数。"]],[["U\u003csub>read\u003c/sub>","电压表读数","V"],["U\u003csub>range\u003c/sub>","电压表所选量程","V"],["n","指针偏转格数","1"],["N","满量程总格数","1"],["U1","串联第一元件两端电压","V"],["U2","串联第二元件两端电压","V"]],[["把电压表格数与满量程格数的比例倒过来。","量程 12 V、满量程 30 格偏转 15 格时，正确读数为 6 V；倒置比例会得到 24 V。"],["把电压表误串联接入被测电路。","电压表应并联在被测元件两端；串联接入会显著改变电路状态。接线前要看清仪表符号和它的接入位置。"]],"电压单位为伏特 V。读指针式电压表时，用所选量程乘指针格数与满量程格数之比；测量前先估计电压，避免超量程。电压表内阻较大，不能串联在电路中代替导线。串联元件的总电压等于各元件两端电压之和，可用于校验电压表读数。",["将电压表并联接在被测元件两端，正确连接正负接线柱。","读取所选量程和指针格数，按 U=量程×偏转格数/满量程格数换算。","对串联部分可把各元件电压相加，与总电压表读数比较检查。"],["电压表选择 3 V 量程，满量程 30 格，指针偏转 20 格，求读数。",["按比例换算：3×20/30=2 V。","确认读数未超过所选量程，并标注单位。"],"读数为 2 V。"],["circuit-01"],["circuit-02"],["电压","电压表","量程","读数","伏特"],12],["circuit-02","串、并联电路的特点","串联电路中各处电流相等，总电压等于各用电器两端电压之和；并联电路各支路两端电压相等，干路电流等于各支路电流之和。",[["串联部分总电压","\u003cmrow>\u003cmi mathvariant=\"normal\">Ut\u003c/mi>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmi mathvariant=\"normal\">U1\u003c/mi>\u003cmo>+\u003c/mo>\u003cmi mathvariant=\"normal\">U2\u003c/mi>\u003c/mrow>\u003c/mrow>","U1、U2 是串联部分各元件两端电压，Ut 是它们两端总电压。"],["并联支路两端电压相等","\u003cmrow>\u003cmi mathvariant=\"normal\">U1\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi mathvariant=\"normal\">U2\u003c/mi>\u003c/mrow>","U1、U2 分别为并联支路两端电压，理想导线连接同一对节点。"],["并联电路各支路电压复核","\u003cmrow>\u003cmi mathvariant=\"normal\">U1\u003c/mi>\u003cmo>=\u003c/mo>\u003cmi mathvariant=\"normal\">Ut\u003c/mi>\u003c/mrow>","并联支路直接连接在理想导线构成的同一对节点之间。"]],[["Ut","并联电路电源两端电压","V"],["U1","第一支路两端电压","V"],["U2","第二支路两端电压","V"],["I1","串联电路第一处电流","A"],["I2","第二支路电流","A"],["It","并联干路总电流","A"],["I\u003csub>mean\u003c/sub>","单位时间内通过导体横截面的电荷量所对应的电流","A"],["Q","通过导体横截面的电荷量","C"],["t","电荷通过导体横截面的时间","s"],["I\u003csub>range\u003c/sub>","电流表所选量程","A"],["I\u003csub>read\u003c/sub>","电流表读数","A"],["n","电压表偏转格数","1"],["N","电压表满量程格数","1"],["U\u003csub>read\u003c/sub>","电压表读数","V"],["U\u003csub>range\u003c/sub>","电压表量程","V"]],[["把并联干路电流写成各支路电流的乘积。","干路电流是分流前各支路电流的和；0.2 A 与 0.3 A 相加为 0.5 A。"],["误以为并联电路各支路电流一定相等。","并联支路电压相等，但支路电流还取决于各支路元件的电阻和电路条件。"]],"先根据电路图判断元件是首尾相连还是接在同一对节点上，再使用对应规律。串联电压要分配到各元件上，并联支路电压相同而电流会分流；不可把串联与并联规律互换。电流表串联测流，电压表并联测压。",["画出并联电路，确认各支路的两端连接在同一对节点。","电源两端电压对应每条支路两端，故各支路电压相等。","在节点处电流分流或汇合，干路电流等于各支路电流之和。"],["两个支路并联，电流分别为 0.2 A 和 0.3 A，求干路电流。",["并联干路电流等于各支路电流之和。","It=0.2+0.3=0.5 A。"],"干路电流为 0.5 A。"],["circuit-03","circuit-01","circuit-04"],[],["串联电路","并联电路","电流规律","电压规律","电路特点"],12],["ohm-01","电阻","电阻表示导体对电流的阻碍作用，单位为欧姆。",[["由电压和电流求电阻","\u003cmrow>\u003cmi>R\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmi>U\u003c/mi>\u003cmi>I\u003c/mi>\u003c/mfrac>\u003c/mrow>","导体两端电压 U 和通过电流 I 来自同一测量状态，I 不为零。"]],[["U","导体两端电压","V"],["I","通过导体的电流","A"],["R","导体电阻","Ω"],["Rk","以 kΩ 表示的电阻数值","kΩ"],["R1","第一只电阻","Ω"],["R2","第二只电阻","Ω"],["Rs","两电阻串联的总电阻","Ω"],["Rp","两电阻并联的等效电阻","Ω"],["It","通过等效电阻的总电流","A"]],[["把 3 kΩ 的数值 3 直接当成 3 Ω 代入，漏掉千欧到欧姆的 1000 倍换算。","6 V 接在 3 kΩ 电阻上，电流应为 0.002 A；把数值 3 当作 Ω 会错误得到 2 A。"],["把欧姆定律误写成电流等于电阻除以电压。","欧姆定律应当用电压除以电阻来求电流；把电阻除以电压不仅关系倒置，所得量纲也不是安培。"],["不说明条件变化就认为电压改变会使导体电阻按比例改变。","电阻由导体材料、长度、横截面积和温度等因素决定；欧姆定律的 U/I 比值在相同条件下描述电阻。"]],"电阻大小与导体材料、长度、横截面积和温度等因素有关；同一导体不能因为电压或电流变大就说电阻一定改变。测电阻时应使用电压表并联、电流表串联，再用 R=U/I 计算。欧姆定律适用条件要明确，灯丝温度改变时电阻也会改变。",["在温度等条件不变时，通过导体的电流随两端电压增大而增大。","电阻越大，对电流的阻碍作用越明显，电流越小。","综合两种变化关系得到 I=U/R。","由测得的 U 与 I 可变形求 R=U/I。"],["某导体两端电压 6 V，通过电流 2 A，求电阻。",["R=U/I=6/2=3 Ω。","欧姆定律适用于导体条件不变的测量状态。"],"电阻为 3 Ω。"],["circuit-01","circuit-02"],["ohm-02"],["电阻","欧姆","电压","电流","测电阻"],13],["ohm-03","变阻器","滑动变阻器通过移动滑片改变接入电路的电阻丝长度，从而改变电阻并调节电路电流或用电器两端电压。",[["定值电阻和变阻器串联总电阻","\u003cmrow>\u003cmi mathvariant=\"normal\">Rs\u003c/mi>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmi mathvariant=\"normal\">R1\u003c/mi>\u003cmo>+\u003c/mo>\u003cmi mathvariant=\"normal\">R2\u003c/mi>\u003c/mrow>\u003c/mrow>","变阻器与定值电阻串联，忽略导线电阻并使用同一欧姆单位。"]],[["R1","定值电阻阻值","Ω"],["R2","变阻器接入电路的阻值","Ω"],["Rs","两电阻串联的总阻值","Ω"],["U","串联部分两端电压","V"],["I","串联电路电流","A"],["R","由电压和电流得到的等效电阻","Ω"]],[["计算定值电阻与变阻器串联总阻值时把二者相乘。","串联总电阻为各电阻之和；10 Ω 和 20 Ω 串联应为 30 Ω。"],["把变阻器滑片移动方向与阻值变化关系不看接线柱就固定判断。","阻值变化由实际接入电路的下接线柱和滑片位置共同决定，必须结合电路连接判断。"]],"滑片移动后，接入电路的电阻丝长度改变，阻值随之变化；滑动变阻器通常串联在电路中，用来保护电路或连续调节电流。若它与固定电阻串联，总电阻等于两者相加；滑片方向与阻值增减的关系要根据实际接入的下接线柱判断。",["观察变阻器接入的接线柱，确定滑片到下接线柱之间哪段电阻丝进入电路。","移动滑片会改变接入电阻丝长度，从而调节变阻器的阻值。","与定值电阻串联时，总电阻为两者之和；再用电流表验证滑片移动带来的变化。"],["20 Ω 定值电阻与接入电路的 30 Ω 变阻器串联，求总电阻。",["确认两个电阻串联。","Rs=20+30=50 Ω。"],"总电阻为 50 Ω。"],["ohm-01"],["ohm-04"],["变阻器","滑动变阻器","串联电阻","电阻调节"],13],["ohm-04","欧姆定律","在温度等条件不变时，通过导体的电流与导体两端电压成正比，与导体电阻成反比，关系式为 I=U/R。",[["欧姆定律求电流","\u003cmrow>\u003cmi>I\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmi>U\u003c/mi>\u003cmi>R\u003c/mi>\u003c/mfrac>\u003c/mrow>","一段导体温度等条件不变，U 用 V、R 用 Ω。"],["由电压和电流求电阻","\u003cmrow>\u003cmi>R\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmi>U\u003c/mi>\u003cmi>I\u003c/mi>\u003c/mfrac>\u003c/mrow>","导体两端电压 U 和通过电流 I 来自同一测量状态，I 不为零。"]],[["U","导体两端电压","V"],["I","通过导体的电流","A"],["R","导体电阻","Ω"],["Rk","以 kΩ 表示的电阻数值","kΩ"],["R1","第一只电阻","Ω"],["R2","第二只电阻","Ω"],["Rs","两电阻串联的总电阻","Ω"],["Rp","两电阻并联的等效电阻","Ω"],["It","通过等效电阻的总电流","A"]],[["把欧姆定律的电流公式误写成电阻除以电压。","同一电阻器两端电压 6 V、电阻 12 Ω 时，电流为 0.5 A，而不是 2 A。"],["认为任何电学元件在任何温度下都保持恒定电阻并严格符合欧姆定律。","灯丝等元件温度变化会影响电阻；使用关系式时要看元件和实验条件。"]],"使用欧姆定律前要确认电路元件和温度条件适用，电压用 V、电流用 A、电阻用 Ω。电阻由导体本身决定，不随同一导体两端电压或通过电流简单改变；电压、电流变化时可用比值检查条件是否保持。",["在温度等条件不变时，通过导体的电流随两端电压增大而增大。","电阻越大，对电流的阻碍作用越明显，电流越小。","综合两种变化关系得到 I=U/R。","由测得的 U 与 I 可变形求 R=U/I。"],["一个电阻器两端电压为 6 V，电阻为 12 Ω，求通过它的电流。",["使用 I=U/R。","I=6/12=0.5 A。"],"电流为 0.5 A。"],["ohm-01"],["ohm-02"],["欧姆定律","电压","电流","电阻"],13],["ohm-02","欧姆定律的应用","欧姆定律可用于计算电路中的电流、电压和等效电阻。",[["两电阻并联等效电阻","\u003cmrow>\u003cmi mathvariant=\"normal\">Rp\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmn>1\u003c/mn>\u003cmrow>\u003cmfrac>\u003cmn>1\u003c/mn>\u003cmi mathvariant=\"normal\">R1\u003c/mi>\u003c/mfrac>\u003cmo>+\u003c/mo>\u003cmfrac>\u003cmn>1\u003c/mn>\u003cmi mathvariant=\"normal\">R2\u003c/mi>\u003c/mfrac>\u003c/mrow>\u003c/mfrac>\u003c/mrow>","两个电阻并联，R1、R2 均为正值。"],["由总电压和总电流求等效电阻","\u003cmrow>\u003cmi mathvariant=\"normal\">Rp\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmi>U\u003c/mi>\u003cmi mathvariant=\"normal\">It\u003c/mi>\u003c/mfrac>\u003c/mrow>","U、It 描述整个等效电路，It 不为零。"]],[["R1","第一只电阻","Ω"],["R2","第二只电阻","Ω"],["Rs","两电阻串联的总电阻","Ω"],["Rp","两电阻并联的等效电阻","Ω"],["U","等效电阻两端电压","V"],["It","通过等效电阻的总电流","A"],["I","通过导体的电流","A"],["R","导体电阻","Ω"],["Rk","以 kΩ 表示的电阻数值","kΩ"]],[["并联电阻只把各支路电阻倒数相加，忘记再取倒数。","6 Ω 与 3 Ω 并联的倒数和为 0.5 Ω⁻¹，等效电阻应为其倒数 2 Ω。"],["认为增加并联支路会增大总电阻。","并联增加额外电流通路，等效电阻会减小；串联增加电阻才会使总电阻增大。"]],"分析实际电路时先辨认串联、并联结构，再化简等效电阻并结合总电压求干路电流。支路电压、电流必须对应正确元件；并联电阻不能直接相加。计算前确认电阻值适用，且电路中的总电压和总电流取同一等效部分。",["串联电阻中电流相同，总电压为各电阻电压之和。","结合欧姆定律可得到串联总电阻为各电阻之和。","并联电阻两端电压相同，干路电流为各支路电流之和。","结合欧姆定律得到并联电阻倒数关系，最后对倒数和再取倒数。"],["6 Ω 和 3 Ω 的电阻并联，求等效电阻。",["1/Rp=1/6+1/3=1/2 Ω⁻¹。","Rp=2 Ω。","并联等效电阻小于较小的支路电阻 3 Ω，结果合理。"],"等效电阻为 2 Ω。"],["ohm-01","circuit-02"],[],["欧姆定律应用","等效电阻","串并联电阻","电路计算"],13],["power-01","电能表与电功","电流通过用电器时，电能可以转化为其他形式的能量。",[["电压电流和时间求电功","\u003cmrow>\u003cmi mathvariant=\"normal\">We\u003c/mi>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmrow>\u003cmi>U\u003c/mi>&#x22C5;\u003cmi>I\u003c/mi>\u003c/mrow>&#x22C5;\u003cmi>t\u003c/mi>\u003c/mrow>\u003c/mrow>","U 用 V、I 用 A、t 用 s，算出的电功单位为 J。"],["千瓦时换算为焦耳","\u003cmrow>\u003cmi mathvariant=\"normal\">EJ\u003c/mi>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmn>3600000\u003c/mn>&#x2062;\u003cmsub>\u003cmi>E\u003c/mi>\u003cmi mathvariant=\"normal\">kWh\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/mrow>","输入电能用 kWh 表示，换算结果用 J 表示。"]],[["U","用电器两端电压","V"],["I","通过用电器的电流","A"],["t","通电时间","s"],["We","电流所做的电功","J"],["E\u003csub>kWh\u003c/sub>","以千瓦时表示的电能","kWh"],["EJ","以焦耳表示的同一电能","J"]],[["把 1 kWh 当成 1000 J，而不是 3.6×10⁶ J。","1 kWh=1000 W×3600 s=3 600 000 J；只乘 1000 漏掉小时到秒的换算。"],["把电功写成电压乘电流，不计通电时间。","U·I 的单位是 W，是功率；求一段时间内的电功还要乘 t。"]],"电功的国际单位是焦耳（J），电能表常用千瓦时（kWh）。1 kWh=3.6×10⁶ J。电功公式中的电压、电流和时间必须属于同一用电过程；将小时换算成秒后可求 J，也可直接以 kW 和 h 计算 kWh。",["电功由用电器两端电压、通过的电流和通电时间共同决定。","以 V、A、s 代入，电压乘电流乘时间得到 J。","电能表读数若以 kWh 给出，可用 1 kWh=3.6×10⁶ J 换算为焦耳。"],["一盏 220 V、1 A 的灯连续工作 1 h，求耗电量的 J 和 kWh 表示。",["1 h=3600 s。","We=220×1×3600=792 000 J。","0.22 kWh×3.6×10⁶=792 000 J。"],"耗电量为 792 000 J，即 0.22 kWh。"],["ohm-01"],["power-02"],["电功","电能","电能表","千瓦时","焦耳"],14],["power-02","电功率","电功率表示电流做功的快慢，等于单位时间内完成的电功。",[["电压与电流求电功率","\u003cmrow>\u003cmi>P\u003c/mi>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmi>U\u003c/mi>&#x22C5;\u003cmi>I\u003c/mi>\u003c/mrow>\u003c/mrow>","U 用 V、I 用 A，所得功率 P 用 W。"],["由电功和时间求功率","\u003cmrow>\u003cmi>P\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmi mathvariant=\"normal\">We\u003c/mi>\u003cmi>t\u003c/mi>\u003c/mfrac>\u003c/mrow>","We 是时间 t 内完成的电功，t 用 s。"]],[["U","用电器两端电压","V"],["I","通过用电器的电流","A"],["P","电功率","W"],["We","一段时间内完成的电功","J"],["t","完成该电功所用时间","s"],["Q","电阻产生的热量","J"],["R","电阻","Ω"]],[["把以 kW 表示的功率数值直接标成 W，换算时多除以 1000。","220 V×1 A=220 W；若要改写成 kW 才是 0.22 kW，不能把 0.22 标成 W。"],["把功率当作总电能，忽略做功时间。","功率表示做功或用电的快慢，电能表示一段时间内做功的总量；前者单位是 W，后者常用 J 或 kWh，二者不能混淆。"],["把电功率写成 U/I。","电功率可由电压与电流相乘得到；电压除以电流不是瓦特，单位组合也不同，因此不能用它表示功率。"]],"额定功率是用电器在额定电压下工作的功率。实际功率取决于实际电压和电流，不能只看铭牌就断言任意电压下的实际功率。比较功率时要区分功率大小与已经消耗的总电能：持续时间不同，耗电量也不同。",["电功率定义为单位时间内完成的电功，P=We/t。","电功 We=UIt，代入 P=We/t 可得 P=UI。","使用时检查额定与实际条件，并标明功率单位 W。"],["用电器两端电压 220 V，通过电流 0.5 A，求电功率。",["P=UI=220×0.5=110 W。","功率单位为 W，结果表示该用电器每秒转化的电能。"],"电功率为 110 W。"],["power-01"],["power-03"],["额定功率","实际功率","瓦特"],14],["power-03","电热器 电流的热效应","电流通过导体时会产生热量，电流通过电阻产生的热量与电流的平方、电阻和通电时间有关，这个规律叫焦耳定律。",[["焦耳定律","\u003cmrow>\u003cmi>Q\u003c/mi>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmrow>\u003cmsup>\u003cmi>I\u003c/mi>\u003cmn>2\u003c/mn>\u003c/msup>&#x22C5;\u003cmi>R\u003c/mi>\u003c/mrow>&#x22C5;\u003cmi>t\u003c/mi>\u003c/mrow>\u003c/mrow>","计算电流通过电阻产生的热量，I 用 A、R 用 Ω、t 用 s。"]],[["Q","电阻产生的热量","J"],["I","通过电阻的电流","A"],["R","电阻","Ω"],["t","通电时间","s"],["U","电阻两端电压","V"],["We","纯电阻电路中的电功","J"],["P","电功率","W"]],[["使用焦耳定律时漏掉电流平方，写成 Q=IRt。","十欧电阻中 2 A 电流通过 5 s，焦耳热为 200 J；漏掉平方会得到 100 J。"],["认为电动机等所有用电器的电功都全部变成电热。","非纯电阻用电器还会输出机械能、光能或声能等；必须区分电功与电热。"]],"焦耳热公式 Q=I²Rt 适用于电流通过电阻产生的热量计算。电流增大对发热影响尤其明显，因为电流以平方出现。对电动机等非纯电阻用电器，电能还会转化为机械能等形式，不能简单认为电功全部等于电热。",["电流通过电阻时将部分电能转化为内能。","实验表明电流增大时发热明显增强，关系中出现电流平方。","综合电流、电阻和通电时间得到 Q=I²Rt。","对纯电阻有 U=IR，因此 UIt 与 I²Rt 相等。"],["10 Ω 电阻通过 2 A 电流 5 s，求产生的热量。",["Q=I²Rt=2²×10×5=200 J。","若为纯电阻，电功也为 200 J。"],"产生 200 J 热量。"],["ohm-01","power-01"],[],["焦耳定律","电热","纯电阻","电能转化"],14],["power-04","家庭电路与安全用电","家庭电路中的用电器通常并联接入，额定电压约为 220 V。",[["由家庭电器总功率估算干路电流","\u003cmrow>\u003cmsub>\u003cmi>I\u003c/mi>\u003cmi mathvariant=\"normal\">总\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmsub>\u003cmi>P\u003c/mi>\u003cmi mathvariant=\"normal\">总\u003c/mi>\u003c/msub>\u003cmi>U\u003c/mi>\u003c/mfrac>\u003c/mrow>","家庭用电器并联且电压近似相同；同时工作的总功率记作 P总，U 为电源电压。"]],[["P\u003csub>总\u003c/sub>","同时工作的用电器总功率","W"],["U","家庭电路电压","V"],["I\u003csub>总\u003c/sub>","家庭电路干路电流估算值","A"],["I","由电功率关系对应的电流","A"]],[["估算家庭电路电流时把总功率除以两倍电压。","功率关系为 P=UI，故 I=P/U；额外除以 2 会把负载电流低估一半。"],["认为保险丝越粗越安全，或在带电状态下更换保险丝。","保险丝规格过大会失去过载保护作用；家庭电路检修需先断电并由合格人员处理。"]],"估算家庭电路电流时，可把并联用电器的总功率除以供电电压。该关系用于判断大功率电器同时工作时的负载大小，不能代替查看插座、导线和断路器的额定参数。安全使用还要避免湿手触电、破损电线和私拉乱接；保险丝不可随意换成更粗规格。",["把同时工作的用电器功率相加，得到总功率 P\u003csub>总\u003c/sub>。","使用 P=UI 反求电流，得到 I\u003csub>总\u003c/sub>=P\u003csub>总\u003c/sub>/U。","将估算电流与线路、插座和保护装置的额定值比较；不能仅凭估算替代安全规范。"],["一台 2.2 kW 电热水器接在 220 V 家庭电路中，估算工作电流。",["先把功率换成瓦：2.2 kW=2200 W。","I=P/U=2200/220=10 A。","再按设备和线路额定参数判断能否安全使用。"],"工作电流约为 10 A。"],["power-02"],[],["家庭电路","过载","额定电流","安全用电","总功率"],14],["magnet-01","磁体、磁场与电流的磁场","磁体周围存在磁场，磁极间会相互作用；磁场方向可用小磁针静止时北极所指方向描述。",[["已知线圈电压求电流","\u003cmrow>\u003cmi mathvariant=\"normal\">Ic\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmi mathvariant=\"normal\">Uc\u003c/mi>\u003cmi mathvariant=\"normal\">Rc\u003c/mi>\u003c/mfrac>\u003c/mrow>","线圈电阻在测量期间近似不变，Uc 用 V、Rc 用 Ω。"],["由线圈电流求电压","\u003cmrow>\u003cmi mathvariant=\"normal\">Uc\u003c/mi>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmi mathvariant=\"normal\">Ic\u003c/mi>&#x22C5;\u003cmi mathvariant=\"normal\">Rc\u003c/mi>\u003c/mrow>\u003c/mrow>","同一线圈温度等条件稳定，电流和电阻对应一次测量。"]],[["Uc","电磁铁线圈两端电压","V"],["Ic","通过电磁铁线圈的电流","A"],["Rc","线圈电阻","Ω"],["N","线圈匝数，按匝计数","1"],["U\u003csub>感\u003c/sub>","感应电路两端已测得的电压","V"],["I\u003csub>感\u003c/sub>","闭合回路中的感应电流","A"],["R\u003csub>loop\u003c/sub>","感应电路总电阻","Ω"]],[["把线圈电流换算成 mA 后仍把数值标成 A，导致电流大 1000 倍。","4 V÷20 Ω=0.2 A；换成毫安是 200 mA，不能仍写作 200 A。"],["把线圈电流写成电阻除以电压。","已测得线圈两端电压和电阻后，应按欧姆定律用电压除以电阻求电流；反过来相除所得量纲不是安培。"],["只增加电压、同时改变线圈匝数和铁芯，还把磁性变化全归因于电流。","探究一个因素影响时要控制其他变量，避免把多个因素的作用混在一起。"]],"本节把磁体的磁场和电流的磁效应连起来看：磁体或电流都能建立磁场，磁场可对磁针、磁体等产生作用。通电螺线管的磁极方向与电流方向有关；研究电磁铁强弱时要控制铁芯和线圈匝数等条件。线圈电流可以按欧姆定律计算，但电流数值不是磁场强弱的直接刻度。",["将螺线管接入电源后，线圈中有电流并产生磁场。","加入铁芯可增强电磁铁磁性；磁性还会随线圈匝数和电流等因素改变。","若要比较电流影响，控制匝数和铁芯不变，只改变电流。","电流可由线圈端电压和电阻通过欧姆定律求得，磁性强弱仍要实验观察。"],["某电磁铁线圈电阻为 20 Ω，接入 6 V 电源，求线圈电流。",["Ic=Uc/Rc=6/20=0.3 A。","该结果描述线圈电流，不等同于磁场强度。"],"线圈电流为 0.3 A。"],["ohm-01"],["magnet-03"],["磁体","磁极","磁场","磁感线","地磁场","电流的磁效应","电磁铁","控制变量"],15],["magnet-03","磁场对电流的作用与电动机","通电导体放在磁场中会受到磁场的作用力；改变电流方向或磁场方向，导体受力方向会改变。",[["匀速提升负载的机械功","\u003cmrow>\u003cmsub>\u003cmi>W\u003c/mi>\u003cmi mathvariant=\"normal\">出\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmsub>\u003cmi>F\u003c/mi>\u003cmi mathvariant=\"normal\">出\u003c/mi>\u003c/msub>&#x22C5;\u003cmsub>\u003cmi>s\u003c/mi>\u003cmi m
