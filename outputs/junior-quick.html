athvariant=\"normal\">出\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/mrow>","负载沿作用力方向移动，力近似恒定；输出的力 用 N、输出端位移 用 m。"],["由输出功和时间求平均功率","\u003cmrow>\u003cmsub>\u003cmi>P\u003c/mi>\u003cmi mathvariant=\"normal\">出\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmsub>\u003cmi>W\u003c/mi>\u003cmi mathvariant=\"normal\">出\u003c/mi>\u003c/msub>\u003cmsub>\u003cmi>t\u003c/mi>\u003cmi mathvariant=\"normal\">run\u003c/mi>\u003c/msub>\u003c/mfrac>\u003c/mrow>","输出功和工作时间对应同一过程，工作时间 大于 0。"],["由平均功率和时间核对输出功","\u003cmrow>\u003cmsub>\u003cmi>W\u003c/mi>\u003cmi mathvariant=\"normal\">出\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmsub>\u003cmi>P\u003c/mi>\u003cmi mathvariant=\"normal\">出\u003c/mi>\u003c/msub>&#x22C5;\u003cmsub>\u003cmi>t\u003c/mi>\u003cmi mathvariant=\"normal\">run\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/mrow>","平均输出功率在这段时间内近似稳定。"]],[["F\u003csub>出\u003c/sub>","电动机对负载所做功对应的平均作用力","N"],["s\u003csub>出\u003c/sub>","负载沿力方向移动的距离","m"],["W\u003csub>出\u003c/sub>","电动机输出的机械功","J"],["t\u003csub>run\u003c/sub>","电动机工作时间","s"],["P\u003csub>出\u003c/sub>","电动机输出的平均机械功率","W"]],[["匀速提升 200 N 的重物 3 m 时，把机械功算成 200/3 J。","恒力沿运动方向做功要把力与位移相乘；除以距离既算不出焦耳，数值也与题意不符。"],["只改变电流方向就断定导体受力方向一定不变。","受力方向同时取决于电流方向和磁场方向；只改变其中一个条件时，受力方向会相应反转。"],["把电动机的电输入功率直接当成机械输出功率。","线圈发热、轴承摩擦和空气阻力都会消耗能量，所以电输入功率通常大于机械输出功率。"]],"判断通电导体的运动方向时，要同时考虑电流方向和磁场方向，不能只看其中一个。磁场力的大小还受电流、磁场和导体等因素影响，初中阶段主要通过实验辨认方向，不把未学的磁场力定量公式当作必背规律。若电动机带动重物匀速上升，可用已学的功和功率关系估算机械输出；这是机械输出的计算，不是磁场力定律。",["通电导体处于磁场中会受力，改变电流或磁场方向可观察受力方向改变。","电动机让线圈在磁场中持续转动，把电能转化为机械能。","重物匀速提升时，输出机械功可按作用力乘沿力方向的距离计算。","用输出功除以工作时间得到平均机械功率，也可反向用功率和时间核对输出功。"],["电动机匀速提升重 200 N 的物体 3 m，用时 10 s，求机械输出功和平均输出功率。",["W\u003csub>出\u003c/sub>=F\u003csub>出\u003c/sub>·s\u003csub>出\u003c/sub>=200×3=600 J。","P\u003csub>出\u003c/sub>=W\u003csub>出\u003c/sub>/t\u003csub>run\u003c/sub>=600/10=60 W。"],"机械输出功为 600 J，平均输出功率为 60 W。"],["fmotion-01","machine-02","machine-05"],["magnet-04"],["磁场对电流的作用","电动机","受力方向","电能转化","机械输出功","机械功率"],15],["magnet-04","安装直流电动机模型","直流电动机模型由磁体、线圈、换向器、电刷和电源等部分组成。",[["已测电压和电流求输入功率","\u003cmrow>\u003cmsub>\u003cmi>P\u003c/mi>\u003cmi mathvariant=\"normal\">入\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmsub>\u003cmi>U\u003c/mi>\u003cmi>m\u003c/mi>\u003c/msub>&#x22C5;\u003cmsub>\u003cmi>I\u003c/mi>\u003cmi>m\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/mrow>","电压和电流对应同一时刻的直流测量，输入功率按电压乘电流估算。"],["由输入功率和时间求电输入电能","\u003cmrow>\u003cmsub>\u003cmi>E\u003c/mi>\u003cmi mathvariant=\"normal\">入\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmsub>\u003cmi>P\u003c/mi>\u003cmi mathvariant=\"normal\">入\u003c/mi>\u003c/msub>&#x22C5;\u003cmsub>\u003cmi>t\u003c/mi>\u003cmi>m\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/mrow>","输入功率在这段通电时间内近似稳定。"],["由电能和时间核对输入功率","\u003cmrow>\u003cmsub>\u003cmi>P\u003c/mi>\u003cmi mathvariant=\"normal\">入\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmsub>\u003cmi>E\u003c/mi>\u003cmi mathvariant=\"normal\">入\u003c/mi>\u003c/msub>\u003cmsub>\u003cmi>t\u003c/mi>\u003cmi>m\u003c/mi>\u003c/msub>\u003c/mfrac>\u003c/mrow>","电能和时间对应同一通电过程，通电时间 大于 0。"]],[["U\u003csub>m\u003c/sub>","电动机模型线圈两端电压","V"],["I\u003csub>m\u003c/sub>","通过电动机模型线圈的电流","A"],["R\u003csub>m\u003c/sub>","线圈电阻","Ω"],["P\u003csub>入\u003c/sub>","电动机模型的电输入功率","W"],["E\u003csub>入\u003c/sub>","电动机模型在这段时间内的电输入电能","J"],["t\u003csub>m\u003c/sub>","电动机模型通电时间","s"]],[["6 V、0.3 A 的模型把输入功率算成 10 W。","6 V 与 0.3 A 应相乘得到 1.8 W；用除法会得到电阻量级而不是电功率。"],["电刷未接触或线圈卡住时，仍把不转归因于磁场方向错误。","线圈不转可能是断路、接触不良或机械卡滞；应先逐项检查，再调整磁场或电流方向。"],["把电输入功率写成电压除以电流。","电功率等于电压乘电流；电压除以电流得到的是电阻，不能表示输入功率。"]],"模型安装和调试要逐项检查电路是否闭合、线圈是否卡住、电刷是否接触良好以及磁场是否存在。若已测得线圈端电压和电阻，可用欧姆定律估算电流；电功率可由电压和电流求得，再乘工作时间估算输入电能。电动机的实际机械输出小于输入电能，不可把输入电能全部当成有用功。",["先按模型结构连接电源、电刷和线圈，并检查线圈能自由转动。","确认磁场存在且电路接触良好后，再短时通电观察线圈是否持续转动。","测量电压和电流后，可用 P\u003csub>入\u003c/sub>=U\u003csub>m\u003c/sub>·I\u003csub>m\u003c/sub> 估算模型的电输入功率。","若功率近似稳定，再用输入功率乘通电时间估算电输入电能，并与电能除以时间复核。"],["直流电动机模型工作时测得 6 V、0.3 A，连续通电 20 s，估算输入功率和输入电能。",["P\u003csub>入\u003c/sub>=U\u003csub>m\u003c/sub>·I\u003csub>m\u003c/sub>=6×0.3=1.8 W。","E\u003csub>入\u003c/sub>=P\u003csub>入\u003c/sub>·t\u003csub>m\u003c/sub>=1.8×20=36 J。"],"输入功率为 1.8 W，20 s 内输入电能为 36 J。"],["magnet-01","power-02","circuit-01"],["magnet-02"],["直流电动机模型","换向器","电刷","线圈","输入电功率","输入电能"],15],["magnet-02","电磁感应与发电机","闭合电路的一部分导体在磁场中做切割磁感线运动时，电路中会产生感应电流，这种现象叫电磁感应。",[["已测感应电压求回路电流","\u003cmrow>\u003cmsub>\u003cmi>I\u003c/mi>\u003cmi mathvariant=\"normal\">感\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmsub>\u003cmi>U\u003c/mi>\u003cmi mathvariant=\"normal\">感\u003c/mi>\u003c/msub>\u003cmsub>\u003cmi>R\u003c/mi>\u003cmi mathvariant=\"normal\">loop\u003c/mi>\u003c/msub>\u003c/mfrac>\u003c/mrow>","感应电压已由仪表测得，闭合回路近似服从欧姆定律。"],["由感应电流和回路电阻求电压","\u003cmrow>\u003cmsub>\u003cmi>U\u003c/mi>\u003cmi mathvariant=\"normal\">感\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmsub>\u003cmi>I\u003c/mi>\u003cmi mathvariant=\"normal\">感\u003c/mi>\u003c/msub>&#x22C5;\u003cmsub>\u003cmi>R\u003c/mi>\u003cmi mathvariant=\"normal\">loop\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/mrow>","电路闭合，感应电流与回路电阻描述同一测量状态。"]],[["U\u003csub>感\u003c/sub>","感应电压","V"],["I\u003csub>感\u003c/sub>","感应电流","A"],["R\u003csub>loop\u003c/sub>","感应电路总电阻","Ω"],["P\u003csub>感\u003c/sub>","感应电源输出的电功率","W"]],[["把感应电流换算成 mA 后仍将毫安数值标作 A。","0.6 V÷3 Ω=0.2 A=200 mA；若把换算后的 200 写成 A，会大 1000 倍。"],["把感应电流写成感应电压乘以回路电阻。","感应电路测得电压后仍按欧姆定律求电流，应当除以电阻；相乘的单位不是 A。"],["认为只要线圈和磁体静止放在一起就一定有持续感应电流。","需要磁场变化或导体与磁场发生相对运动；静止且磁场不变时没有持续感应电流。"]],"磁体与线圈相对运动或线圈所在磁场发生变化时，可能出现感应电流；磁场不变且没有相对运动时，通常没有持续感应电流。实验中电流表用于观察感应电流，方向变化可由指针偏转方向判断。以下电学关系只在感应电压已经测出后用于计算回路电流，不负责预测感应电压大小。",["将线圈与电流表连成闭合回路，并使磁体与线圈发生相对运动。","观察电流表是否偏转，确认是否产生感应电流。","若需定量计算，先测得感应电压和回路电阻，再用欧姆定律求电流。","改变运动方向或磁场方向观察电流方向变化，不用此电路公式预测感应电压。"],["电磁感应实验中测得回路电压 0.6 V，回路电阻为 3 Ω，求感应电流。",["I\u003csub>感\u003c/sub>=U\u003csub>感\u003c/sub>/R\u003csub>loop\u003c/sub>=0.6/3=0.2 A。","电压是实验测量值，本式不预测感应电压如何产生。"],"感应电流为 0.2 A。"],["ohm-01","circuit-02"],[],["电磁感应","感应电流","磁场变化","相对运动","电流表"],15],["emwave-03","信息与信息传播","信息可以记录在文字、图像、声音等载体中，并通过声、光或电磁信号传递。",[["按符号速率估算传输时间","\u003cmrow>\u003cmsub>\u003cmi>N\u003c/mi>\u003cmi mathvariant=\"normal\">sym\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmsub>\u003cmi>R\u003c/mi>\u003cmi mathvariant=\"normal\">sym\u003c/mi>\u003c/msub>&#x22C5;\u003cmsub>\u003cmi>t\u003c/mi>\u003cmi mathvariant=\"normal\">info\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/mrow>","传送速率在该段时间内近似稳定；传送速率 用每秒符号数表示，传送时间 用 s。"],["由符号数和时间求平均传送速率","\u003cmrow>\u003cmsub>\u003cmi>R\u003c/mi>\u003cmi mathvariant=\"normal\">sym\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmsub>\u003cmi>N\u003c/mi>\u003cmi mathvariant=\"normal\">sym\u003c/mi>\u003c/msub>\u003cmsub>\u003cmi>t\u003c/mi>\u003cmi mathvariant=\"normal\">info\u003c/mi>\u003c/msub>\u003c/mfrac>\u003c/mrow>","符号总数和传送时间对应同一段传输，传送时间 大于 0。"]],[["N\u003csub>sym\u003c/sub>","一段信息中传送的符号总数，按个计数","1"],["R\u003csub>sym\u003c/sub>","平均符号传送速率，每秒传送的符号数","Hz"],["t\u003csub>info\u003c/sub>","传送这段符号信息所用的时间","s"]],[["把传送 5 s 当成 5 ms，再把符号总数少算 1000 倍。","情境时间已经用秒表示，不能再次按毫秒缩小；重复换算会让估算结果少 1000 倍。"],["把每秒传送的符号数误当成整段信息的符号总数。","符号总数还要乘以传送时间；只写每秒速率会漏掉时间因素，题目问总量时尤其要注意。"],["把符号传送速率等同于电磁波载波频率或每秒比特数。","符号速率、载波频率和比特率的定义不同；没有调制和编码信息时，不能把三者数值直接等同。"]],"通信过程既有信号在空间传播所需的时间，也有信息符号逐个传送所需的时间，两者不能混为一谈。下面的简单速率模型只计算在给定平均符号传送速率下传送一段信息所需的时间，不描述编码、纠错、排队或网络协议；符号速率不是电磁波载波频率，也不等同于每秒比特数。",["信息先被记录或编码成可以传送的信号。","信号需要经过发射、传播和接收，接收端再从信号中还原信息。","若用平均符号速率描述一段稳定传输，符号总数等于每秒符号数乘以时间。","此拓展模型只算符号传送时间；真实通信还会受编码、纠错、设备处理和网络排队影响。"],["一个简化通信模型中，平均每秒传送 600 个符号，传送 5 s，估算传过的符号总数。",["N\u003csub>sym\u003c/sub>=R\u003csub>sym\u003c/sub>·t\u003csub>info\u003c/sub>=600×5=3000 个符号。","这是符号数的拓展估算，不代表网络端到端时延或比特率。"],"约传送 3000 个符号。"],["motion-01","emwave-01"],["emwave-01"],["信息","信息传播","通信信号","符号速率","拓展模型"],16],["emwave-01","电磁波的波速、频率和波长","电磁波能够在真空中传播，真空中的传播速度约为 3.0×10⁸ m/s。",[["波速等于波长乘频率","\u003cmrow>\u003cmi>c\u003c/mi>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmi>λ\u003c/mi>&#x22C5;\u003cmi>f\u003c/mi>\u003c/mrow>\u003c/mrow>","波长 λ 用 m、频率 f 用 Hz，c 用 m/s；真空波速取约 3.0×10⁸ m/s。"],["由波速和频率求波长","\u003cmrow>\u003cmi>λ\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmi>c\u003c/mi>\u003cmi>f\u003c/mi>\u003c/mfrac>\u003c/mrow>","电磁波在真空或近似真空的空气中传播，f 不为零。"]],[["c","电磁波在真空中的传播速度近似值","m/s"],["λ","电磁波波长","m"],["f","电磁波频率","Hz"],["d","电磁波传播距离","m"],["t","理想传播所用时间","s"]],[["频率已用 Hz 代入后，又按 MHz 再除以 1 000 000，造成波速少算百万倍。","情境中的 100 000 000 已是 Hz；与 3 m 相乘应得到 3.0×10⁸ m/s，不应重复换算。"],["把波长与频率相乘写成频率除以波长。","波速关系为波长乘频率；f/λ 的单位不是 m/s。"],["认为电磁波传播必须依赖空气或其他介质。","电磁波能够在真空中传播；声波需要介质，两类波的传播条件不同。"]],"无线电波、微波、红外线、可见光、紫外线、X 射线和伽马射线都属于电磁波，主要差别包括频率和波长范围。电磁波不需要空气等介质才能传播。使用波速关系时，波长用 m、频率用 Hz，所得波速为 m/s；空气中传播速度可近似按真空光速处理。",["电磁波每秒传播一定距离，该距离为波速 c。","波长 λ 表示相邻同相位点之间的距离，频率 f 表示每秒振动次数。","每秒前进的完整波长数乘以波长，得到 c=λ·f。","同一真空中 c 近似不变，所以频率越高波长越短。"],["某无线电波频率为 100 MHz，在真空中传播，求波长。",["100 MHz=100 000 000 Hz。","λ=c/f=3.0×10⁸/100 000 000=3 m。"],"波长约为 3 m。"],["particle-02"],["emwave-02"],["电磁波","波速","频率","波长","无线电波","微波"],16],["emwave-02","电磁波传播与通信时延","无线通信把信息转换成电信号并调制到电磁波上，经空间传播后由接收设备还原信息。",[["传播距离与时间关系","\u003cmrow>\u003cmi>d\u003c/mi>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmi>c\u003c/mi>&#x22C5;\u003cmi>t\u003c/mi>\u003c/mrow>\u003c/mrow>","电磁波在空气中近似以真空光速传播，且只计算单程传播。"],["由距离和波速求传播时间","\u003cmrow>\u003cmi>t\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmi>d\u003c/mi>\u003cmi>c\u003c/mi>\u003c/mfrac>\u003c/mrow>","d 为单程距离，c 为这段路径上的近似传播速度。"]],[["d","电磁波传播距离","m"],["c","电磁波传播速度近似值","m/s"],["t","理想传播所用时间","s"],["λ","电磁波波长","m"],["f","电磁波频率","Hz"]],[["把单程传播距离误当成往返距离，计算时多乘 2。","通信单程时延只对应单程路径；若题目明确发射后返回的回波才计算往返。"],["把光速传播时间当成端到端网络响应时间。","互联网通信还包含路由、排队和设备处理时间，理想传播时延只是其中一部分。"]],"无线电波传播速度接近真空光速，因此远距离通信仍有传播时延；实际通信总时延还包括设备处理、排队和网络转发时间。用路程和时间估算只能表示理想的一段传播过程，不代表整个互联网应用的响应时间。",["把通信链路的单程距离 d 统一为 m。","无线电波在空气中的速度近似取 3.0×10⁸ m/s。","用距离除以波速估算理想传播时间。","实际通信还包含设备处理等时延，不能把估算值当成端到端总时延。"],["电磁波在空气中传播 30 km，按 3.0×10⁸ m/s 估算单程时间。",["30 km=30 000 m。","t=d/c=30 000/(3.0×10⁸)=0.0001 s。"],"理想单程传播时间约为 0.0001 s。"],["emwave-01","motion-01"],[],["无线通信","传播速度","时延","单程距离"],16],["sustain-01","能源利用与社会发展中的耗电估算","能源利用支撑照明、交通、生产和现代生活。",[["功率和时间求耗电量","\u003cmrow>\u003cmi>E\u003c/mi>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmi>P\u003c/mi>&#x22C5;\u003cmi>t\u003c/mi>\u003c/mrow>\u003c/mrow>","P 用 kW、t 用 h，所得电能 E 用 kWh。"],["由耗电量和使用时间求平均功率","\u003cmrow>\u003cmi>P\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmi>E\u003c/mi>\u003cmi>t\u003c/mi>\u003c/mfrac>\u003c/mrow>","电能 E 用 kWh、时间 t 用 h，所得平均功率 P 用 kW。"]],[["P","用电器的工作功率","kW"],["t","用电时间","h"],["E","消耗的电能","kWh"]],[["LED灯功率为 0.01 kW、使用 5 h，却把耗电量写成 0.002 kWh。","0.01 kW×5 h=0.05 kWh；除法结果不仅数值错误，单位也不能表示耗电量。"],["把耗电量写成功率除以使用时间。","耗电量等于功率乘以时间；功率再除以时间会得到功率变化率，不是电能。"],["只看额定功率较小，就断定设备一定更节能而不看使用时长。","耗电量还取决于使用时间；小功率设备长时间运行也可能耗电更多。"]],"社会发展会带来更多能源需求，因此既要保证合理用能，也要减少不必要的浪费。比较同一项用电服务的耗电量时，应确认功率和使用时间的单位一致；当功率用 kW、时间用 h 时，乘积直接得到 kWh。该关系只计算用电量，不足以单独评价能源来源的环境影响或可持续性。",["读取用电器铭牌或题目给出的工作功率。","把功率统一成 kW、时间统一成 h。","功率乘以使用时间，得到以 kWh 表示的电能。","同一类服务下比较不同设备或不同时长的耗电量，避免只凭额定功率判断。"],["一盏功率为 0.01 kW 的 LED 灯连续使用 5 h，求消耗的电能。",["E=P·t=0.01×5=0.05 kWh。","此结果只描述这段时间的用电量，不代表整套能源方案的环境影响。"],"消耗电能为 0.05 kWh。"],["power-01","power-02"],["sustain-03"],["节能","电能","功率","使用时间","千瓦时"],17],["sustain-03","核能","核能储存在原子核内部，核裂变和核聚变过程都能释放核能。",[["由电功率估算核电站输出电能","\u003cmrow>\u003cmsub>\u003cmi>E\u003c/mi>\u003cmi mathvariant=\"normal\">el\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmsub>\u003cmi>P\u003c/mi>\u003cmi mathvariant=\"normal\">el\u003c/mi>\u003c/msub>&#x22C5;\u003cmsub>\u003cmi>t\u003c/mi>\u003cmi mathvariant=\"normal\">n\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/mrow>","对外电功率在所计时间内近似稳定，时间用 s、电功率用 W。"],["由输出电能和时间求平均电功率","\u003cmrow>\u003cmsub>\u003cmi>P\u003c/mi>\u003cmi mathvariant=\"normal\">el\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmsub>\u003cmi>E\u003c/mi>\u003cmi mathvariant=\"normal\">el\u003c/mi>\u003c/msub>\u003cmsub>\u003cmi>t\u003c/mi>\u003cmi mathvariant=\"normal\">n\u003c/mi>\u003c/msub>\u003c/mfrac>\u003c/mrow>","输出电能和时间对应同一过程，通电时间 大于 0。"]],[["P\u003csub>el\u003c/sub>","核电站对外输出的电功率","W"],["t\u003csub>n\u003c/sub>","持续输出的时间","s"],["E\u003csub>el\u003c/sub>","这段时间输出的电能","J"]],[["核电站 1.0×10⁹ W 运行 3600 s，误将时间除以 3600 再代入。","题目给出的运行时间已是秒，重复除以 3600 会把应有输出电能缩小 3600 倍。"],["把核能说成在电站内一步直接变成电能。","核电站先通过裂变加热介质，再驱动汽轮机和发电机，能量经历多个转化环节。"],["把输出电能写成输出功率除以运行时间。","输出电能是功率对时间的累积，应将功率乘运行时间；相除得到的单位也不再是焦耳。"]],"核电站不是把核能直接变成电能：能量会经历核能、内能、机械能和电能等形式的转化。若已知电站对外输出的电功率，可以用功率乘运行时间估算一段时间输出的电能；这是通用电功率关系的应用，不是核反应释放能量的预测公式。讨论核能时还应区分运行排放、核废料管理和事故风险等不同问题。",["核裂变释放的核能先转化为内能，再驱动汽轮机和发电机。","电站输出电功率表示单位时间输出的电能。","当功率近似稳定时，用输出功率乘运行时间估算输出电能。","这一估算只计算已知的电功率输出，不从反应物质量推算核反应能量。"],["某发电装置对外输出功率为 1.0×10⁹ W，若连续输出 3600 s，估算输出电能。",["E\u003csub>el\u003c/sub>=P\u003csub>el\u003c/sub>·t\u003csub>n\u003c/sub>=1.0×10⁹×3600=3.6×10¹² J。","这是输出电能估算，不能据此倒推核燃料释放能量。"],"输出电能约为 3.6×10¹² J。"],["power-02","energy-04"],["sustain-04"],["核能","核裂变","核聚变","核电站","能量转化","运行风险"],17],["sustain-04","太阳能","太阳能来自太阳辐射，属于可再生能源，可用于光热和光伏等技术。",[["估算水吸收的热量","\u003cmrow>\u003cmsub>\u003cmi>Q\u003c/mi>\u003cmi mathvariant=\"normal\">water\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmrow>\u003cmsub>\u003cmi>c\u003c/mi>\u003cmi mathvariant=\"normal\">water\u003c/mi>\u003c/msub>&#x22C5;\u003cmsub>\u003cmi>m\u003c/mi>\u003cmi mathvariant=\"normal\">water\u003c/mi>\u003c/msub>\u003c/mrow>&#x22C5;\u003cmi mathvariant=\"normal\">dT\u003c/mi>\u003c/mrow>\u003c/mrow>","只计算水吸收的热量，忽略容器热容和散热；水的比热容用 J/kg/℃。"],["由吸收热量估算水的升温","\u003cmrow>\u003cmi mathvariant=\"normal\">dT\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmsub>\u003cmi>Q\u003c/mi>\u003cmi mathvariant=\"normal\">water\u003c/mi>\u003c/msub>\u003cmrow>\u003cmsub>\u003cmi>c\u003c/mi>\u003cmi mathvariant=\"normal\">water\u003c/mi>\u003c/msub>&#x22C5;\u003cmsub>\u003cmi>m\u003c/mi>\u003cmi mathvariant=\"normal\">water\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/mfrac>\u003c/mrow>","水的质量和比热容已知且非零，暂不计热损失。"]],[["c\u003csub>water\u003c/sub>","水的比热容","J/kg/℃"],["m\u003csub>water\u003c/sub>","被加热水的质量","kg"],["dT","水升高的温度","℃"],["Q\u003csub>water\u003c/sub>","水吸收的热量","J"]],[["0.2 kg 水升高 15 ℃，误将热量算成 56 J。","按 4200 J/kg/℃、0.2 kg 和 15 ℃ 相乘，结果为 12600 J；不能把温升放到分母。"],["把太阳能热水器的太阳输入能量直接等同于水吸收的热量。","太阳辐射到水之间会经过集热器和管路，途中有反射与散热，水吸收的热量只是输入能量的一部分。"],["把水吸收的热量算成比热容乘质量再除以升温。","水的吸热量随温升增大而增大；公式中应乘温升，除以温升还会破坏焦耳的量纲。"]],"估算太阳能热水器把水加热所需能量时，可把水看作吸收热量的物体，用水的比热容、质量和升高的温度计算吸收的热量。该关系只描述水获得的热量，不等于太阳辐射总能量；由于装置存在反射、散热等损失，太阳提供的能量通常更大。太阳能可再生，但并非任何时间和地点都能稳定提供相同功率。",["太阳辐射能被集热器吸收，并传给水。","先确定被加热水的质量和温度变化。","按水的比热容关系计算水吸收的热量。","由于集热器和管路会向环境散热，太阳输入能量不能简单等同于水获得的热量。"],["太阳能热水器把 0.2 kg 的水加热 15 ℃，忽略散热，估算水吸收的热量。",["Q\u003csub>water\u003c/sub>=c\u003csub>water\u003c/sub>·m\u003csub>water\u003c/sub>·dT。","代入 4200×0.2×15=12600 J。","太阳能集热器实际输入能量还需考虑散热损失。"],"水吸收的热量约为 1.26×10⁴ J。"],["energy-02","energy-03"],["sustain-02"],["太阳能","光热利用","光伏","比热容","热水器","可再生能源"],17],["sustain-02","能量转化的基本规律","能量可以从一种形式转化为另一种形式，也可以在物体之间传递；在转化和传递过程中，能量总量保持不变。",[["能量输入与各输出的平衡","\u003cmrow>\u003cmsub>\u003cmi>E\u003c/mi>\u003cmi mathvariant=\"normal\">入\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmsub>\u003cmi>E\u003c/mi>\u003cmi mathvariant=\"normal\">use\u003c/mi>\u003c/msub>\u003cmo>+\u003c/mo>\u003cmsub>\u003cmi>E\u003c/mi>\u003cmi mathvariant=\"normal\">损\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/mrow>","按给定系统边界统计全部有用输出与损耗，能量单位一致。"],["能量利用效率","\u003cmrow>\u003cmi>η\u003c/mi>\u003cmo>=\u003c/mo>\u003cmfrac>\u003cmsub>\u003cmi>E\u003c/mi>\u003cmi mathvariant=\"normal\">use\u003c/mi>\u003c/msub>\u003cmsub>\u003cmi>E\u003c/mi>\u003cmi mathvariant=\"normal\">入\u003c/mi>\u003c/msub>\u003c/mfrac>\u003c/mrow>","有用能量与输入能量使用相同单位，输入能量大于零。"]],[["E\u003csub>入\u003c/sub>","设备输入的能量","J"],["E\u003csub>use\u003c/sub>","转化得到的有用能量","J"],["E\u003csub>损\u003c/sub>","未成为目标有用输出的能量","J"],["η","能量利用效率，以小数表示","1"],["P","用电器功率","kW"],["t","使用时间","h"],["E","使用期间消耗的电能","kWh"],["P\u003csub>old\u003c/sub>","原用电器功率","kW"],["P\u003csub>new\u003c/sub>","替换后用电器功率","kW"],["E\u003csub>save\u003c/sub>","替换后节省的电能","kWh"]],[["把能量利用效率写成输入能量除以有用能量。","效率是有用输出占输入的比例；高效电机情境中为 80/100=0.8，而不是 1.25。"],["认为可再生能源没有任何环境影响，或认为能量损耗意味着能量消失。","可再生能源的利用仍可能影响生态和土地；损耗能量通常转化为不易利用的热、声等形式，并未违反能量守恒。"]],"分析能量转化时要先划定研究对象和过程，再把输入、有用输出以及转化到环境中的其他能量分别列出。能量守恒不表示每一部分能量都同样容易利用；效率是有用能量与输入能量之比，不能超过 100%。本节的能量账目关系可用于检查转换过程是否漏项，效率关系用于比较装置利用输入能量的程度。",["给能量转换过程划定系统边界，统计输入能量。","把输出分成完成目标的有用能量与其他转化能量。","能量守恒要求输入与全部输出相等。","有用输出除以输入能量得到效率，可乘 100% 表示百分数。"],["一台装置输入 100 J 能量，其中 80 J 转化为有用输出，求效率和其他能量。",["效率 η=80/100=0.8=80%。","其他转化能量为 100-80=20 J。"],"效率为 80%，其他能量为 20 J。"],["energy-01","machine-03"],["sustain-05"],["可再生能源","不可再生能源","能量守恒","能源效率","可持续发展"],17],["sustain-05","能源与可持续发展","能源与可持续发展要求兼顾当前生产生活需要、资源长期供应和生态环境保护。",[["计算旧设备在相同服务时段的耗电量","\u003cmrow>\u003cmsub>\u003cmi>E\u003c/mi>\u003cmi mathvariant=\"normal\">old\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmsub>\u003cmi>P\u003c/mi>\u003cmi mathvariant=\"normal\">old\u003c/mi>\u003c/msub>&#x22C5;\u003cmsub>\u003cmi>t\u003c/mi>\u003cmi mathvariant=\"normal\">use\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/mrow>","功率近似稳定，时间用 s、功率用 W，所得能量为 J。"],["计算新设备在相同服务时段的耗电量","\u003cmrow>\u003cmsub>\u003cmi>E\u003c/mi>\u003cmi mathvariant=\"normal\">new\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmsub>\u003cmi>P\u003c/mi>\u003cmi mathvariant=\"normal\">new\u003c/mi>\u003c/msub>&#x22C5;\u003cmsub>\u003cmi>t\u003c/mi>\u003cmi mathvariant=\"normal\">use\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/mrow>","新设备功率近似稳定，且新旧设备工作时间相同。"],["由新旧设备耗电量求节能量","\u003cmrow>\u003cmsub>\u003cmi>E\u003c/mi>\u003cmi mathvariant=\"normal\">save\u003c/mi>\u003c/msub>\u003cmo>=\u003c/mo>\u003cmrow>\u003cmsub>\u003cmi>E\u003c/mi>\u003cmi mathvariant=\"normal\">old\u003c/mi>\u003c/msub>\u003cmo>−\u003c/mo>\u003cmsub>\u003cmi>E\u003c/mi>\u003cmi mathvariant=\"normal\">new\u003c/mi>\u003c/msub>\u003c/mrow>\u003c/mrow>","新旧方案提供相同服务，且旧方案耗能不小于新方案。"]],[["P\u003csub>old\u003c/sub>","旧设备功率","W"],["P\u003csub>new\u003c/sub>","新设备功率","W"],["t\u003csub>use\u003c/sub>","两种设备提供相同服务的使用时间","s"],["E\u003csub>old\u003c/sub>","旧设备在该时段消耗的电能","J"],["E\u003csub>new\u003c/sub>","新设备在该时段消耗的电能","J"],["E\u003csub>save\u003c/sub>","新设备相对旧设备减少的耗电量","J"]],[["把新设备耗电量加到旧设备耗电量上当成节能量。","节能量是旧设备比新设备多消耗的部分，应做差而不是相加。比较之前先统一时间范围和所提供的服务。"],["比较灯具节能量时让旧灯和新灯使用不同时间。","要比较相同服务，必须统一照明时长等条件。比较之前先统一时间范围和所提供的服务。"],["仅凭一次电费差值就断定一种能源在全生命周期都更可持续。","生命周期评价还涉及制造、运输、发电来源、维护和回收等边界。比较之前先统一时间范围和所提供的服务。"]],"比较节能措施时，先确保新旧方案提供相同的照明、出行或生产服务，再比较同一使用时长内的耗电量差。功率较低并不自动意味着更可持续，还要考虑设备寿命、发电结构、材料和回收等因素。本条用新旧设备的耗电量差做一个边界清楚的定量例子，不把单次能耗计算冒充完整的生命周期评价。",["先确定新旧方案提供的是同一项服务，使用时长也相同。","分别按功率乘时间计算两种设备消耗的电能。","用旧设备耗电量减去新设备耗电量，得到该时段的节能量。","完整的可持续性判断还要比较能源来源、排放、设备寿命和回收，不能只靠这一个能耗差。"],["旧灯功率 60 W，新灯功率 10 W，两者提供相同照明且各使用 3600 s，求这段时间少消耗的电能。",["E\u003csub>old\u003c/sub>=60×3600=216000 J。","E\u003csub>new\u003c/sub>=10×3600=36000 J。","E\u003csub>save\u003c/sub>=E\u003csub>old\u003c/sub>−E\u003csub>new\u003c/sub>=180000 J。"],"新灯在该时段少消耗 180000 J 电能。"],["sustain-01","sustain-02","power-01"],[],["可持续发展","节能","能源效率","可再生能源","环境影响","生命周期边界"],17]]}</script><script>
(()=>{'use strict';
const data=JSON.parse(document.getElementById('kb-data').textContent),groups=data.g,points=data.p;
const SEGMENT_ROOT='初中物理',QUIZ_HREF='quiz-junior.html',RETURN_PAGE='junior.html';
const viewBox=document.getElementById('content'),search=document.getElementById('search'),chapter=document.getElementById('chapter'),counter=document.getElementById('count');
const strip=s=>{const e=document.createElement('div');e.innerHTML=s||'';return(e.textContent||'').toLowerCase()};
const clean=s=>(s||'').toLowerCase().replace(/\s+/g,' ').trim();
const text=s=>{const e=document.createElement('span');e.textContent=s||'';return e.innerHTML};
const groupName=i=>groups[i][0].split('·').slice(1).join('·').trim()||groups[i][0];
let view=['points','formulas','symbols','map'].includes(location.hash.slice(1))?location.hash.slice(1):'points';
let domain='全部',chapterName='全部',query='';
const pointIndex=new Map(points.map((p,i)=>[p[0],i]));

// 搜索只从给人看的字段建立索引，不把公式解析器的内部名称重新写进页面。
const pointSearch=points.map(p=>clean([p[1],p[2],p[6],p[11].join(' '),groups[p[12]][0],groups[p[12]][1],...p[3].flat(),...p[4].flat(),...p[5].flat()].map(strip).join(' ')));
const formulas=[];points.forEach((p,i)=>p[3].forEach((f,k)=>formulas.push([i,k,clean([strip(p[1]),strip(f[0]),strip(f[2]),...p[4].map(s=>strip(s[0])+' '+strip(s[1])),groups[p[12]][0]].join(' '))])));
const symbols=[],symbolMap=new Map();points.forEach((p,i)=>p[4].forEach(s=>{const key=s.join('|');if(!symbolMap.has(key)){symbolMap.set(key,symbols.length);symbols.push([s,[i]])}else symbols[symbolMap.get(key)][1].push(i)}));

function matchPoint(i){const p=points[i],g=groups[p[12]];return(domain==='全部'||g[1]===domain)&&(chapterName==='全部'||g[0]===chapterName)&&(!query||pointSearch[i].includes(query))}
function formulaHTML(f){return '<div class="formula"><div class="formula-name">'+f[0]+'</div><div class="math"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block">'+f[1]+'</math></div>'+(f[2]?'<div class="when">适用：'+f[2]+'</div>':'')+'</div>'}
function symbolHTML(s){return '<div class="sym-row"><div class="sym-name">'+s[0]+'</div><div>'+s[1]+'</div><div class="sym-unit">'+s[2]+'</div></div>'}
function errorHTML(e){return '<div class="error"><b>'+e[0]+'</b><p>'+e[1]+'</p></div>'}
function relationHTML(p,i){let before=p[9].map(id=>pointIndex.get(id)).filter(x=>x!==undefined),after=p[10].map(id=>pointIndex.get(id)).filter(x=>x!==undefined);const members=groups[p[12]][3],pos=members.indexOf(i);if(!before.length&&pos>0)before=[members[pos-1]];if(!after.length&&pos<members.length-1)after=[members[pos+1]];const row=(label,list)=>list.length?'<div class="relation-line"><span>'+label+'</span>'+list.map(j=>'<button data-go="'+j+'">'+points[j][1]+'</button>').join('')+'</div>':'';return before.length||after.length?'<section class="relations"><h3>知识关系</h3>'+row('先理解',before)+row('接着看',after)+'</section>':''}
function pointHTML(i){const p=points[i],g=groups[p[12]],more=p[5].length>2?'<details class="more-errors"><summary>查看其余 '+(p[5].length-2)+' 条常见错误</summary>'+p[5].slice(2).map(errorHTML).join('')+'</details>':'';return '<article class="card" id="'+p[0]+'"><div class="path">'+g[1]+' · '+text(groupName(p[12]))+'</div><h2>'+p[1]+'</h2><p class="definition">'+p[2]+'</p><section class="block"><h3>核心公式</h3><div class="formulas">'+p[3].map(formulaHTML).join('')+'</div></section><section class="block"><h3>容易出错</h3>'+p[5].slice(0,2).map(errorHTML).join('')+more+'</section><section class="block"><h3>符号与单位</h3><div class="symbols"><div class="sym-row head"><div>符号</div><div>含义</div><div>单位</div></div>'+p[4].map(symbolHTML).join('')+'</div></section>'+relationHTML(p,i)+'<details class="deep" data-deep="'+i+'"><summary>深入理解：物理意义、推导和例题</summary><div class="deep-content"></div></details><div class="card-practice"><a href="'+QUIZ_HREF+'?mode=example&amp;point='+encodeURIComponent(p[0])+'&amp;source='+encodeURIComponent(SEGMENT_ROOT+'速查版')+'&amp;return='+encodeURIComponent(RETURN_PAGE+'#'+p[0])+'">练这道题 ↗</a></div></article>'}
function deepHTML(p){const ex=p[8];return '<h3>物理意义</h3><p>'+p[6]+'</p>'+(p[7].length?'<h3>推导要点</h3><ol>'+p[7].map(x=>'<li>'+x+'</li>').join('')+'</ol>':'')+(ex[0]?'<h3>典型例题</h3><p>'+ex[0]+'</p><ol>'+ex[1].map(x=>'<li>'+x+'</li>').join('')+'</ol><p class="answer">答案：'+ex[2]+'</p>':'')}
function renderPoints(){const ids=points.map((_,i)=>i).filter(matchPoint);viewBox.className='list';viewBox.innerHTML=ids.map(pointHTML).join('');return ids.length}
function renderFormulas(){const rows=formulas.filter(row=>matchPoint(row[0])&&(!query||row[2].includes(query)));viewBox.className='index-grid';viewBox.innerHTML=rows.map(([i,k])=>'<article class="index-card"><button class="source" data-go="'+i+'">'+points[i][1]+'</button><h2>'+points[i][3][k][0]+'</h2>'+formulaHTML(points[i][3][k])+'</article>').join('');return rows.length}
function renderSymbols(){const rows=symbols.filter(([s,ids])=>ids.some(matchPoint)&&(!query||clean([strip(s[0]),strip(s[1]),strip(s[2]),...ids.map(i=>strip(points[i][1]))].join(' ')).includes(query)));viewBox.className='symbol-grid';viewBox.innerHTML=rows.map(([s,ids])=>{const target=ids.find(matchPoint);return '<article class="symbol-card"><div class="sym-name">'+s[0]+'</div><p>'+s[1]+'</p><div class="sym-unit">'+s[2]+'</div><button class="source" data-go="'+target+'">'+points[target][1]+(ids.length>1?' 等'+ids.length+'处':'')+'</button></article>'}).join('');return rows.length}
function renderMap(){const gs=groups.map((g,i)=>[g,i]).filter(([g])=>(domain==='全部'||g[1]===domain)&&(chapterName==='全部'||g[0]===chapterName));const domains=[...new Set(gs.map(([g])=>g[1]))];viewBox.className='';viewBox.innerHTML='<div class="map-title"><h2>知识脉络</h2><p>按领域与章节串联知识点；章节顺序是学习建议，点击可打开速查卡。</p></div><div class="map-root">'+SEGMENT_ROOT+'</div>'+domains.map(d=>'<section class="map-domain"><h2>'+d+'<small>'+gs.filter(([g])=>g[1]===d).length+'章</small></h2><div class="map-chapters">'+gs.filter(([g])=>g[1]===d).map(([g,gi])=>'<div class="map-chapter"><button data-chapter-go="'+gi+'">'+text(groupName(gi))+' →</button><div class="map-points">'+g[3].map(i=>'<button class="map-point" data-go="'+i+'">'+points[i][1]+'</button>').join('')+'</div></div>').join('')+'</div></section>').join('');return gs.length}
function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));let count=view==='points'?renderPoints():view==='formulas'?renderFormulas():view==='symbols'?renderSymbols():renderMap();counter.textContent=view==='map'?'知识脉络':'显示 '+count+' 项';document.getElementById('empty').hidden=count>0}
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>{view=b.dataset.view;history.replaceState(null,'','#'+view);render();window.scrollTo(0,0)}));
document.querySelectorAll('.filter').forEach(b=>b.addEventListener('click',()=>{domain=b.dataset.domain;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));render()}));
chapter.addEventListener('change',()=>{chapterName=chapter.value;render()});search.addEventListener('input',()=>{query=clean(search.value);if(query&&view==='map'){view='points';history.replaceState(null,'','#points')}render()});
document.addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement!==search){e.preventDefault();search.focus()}});
document.addEventListener('toggle',e=>{const d=e.target;if(d.matches&&d.matches('details[data-deep]')&&d.open){const slot=d.querySelector('.deep-content');if(!slot.dataset.loaded){slot.innerHTML=deepHTML(points[Number(d.dataset.deep)]);slot.dataset.loaded='1'}}},true);
document.addEventListener('click',e=>{const go=e.target.closest('[data-go]');if(go){const i=Number(go.dataset.go);view='points';domain='全部';chapterName='全部';query='';search.value='';chapter.value='全部';document.querySelectorAll('.filter').forEach(b=>b.classList.toggle('active',b.dataset.domain==='全部'));render();document.getElementById(points[i][0]).scrollIntoView({behavior:'smooth',block:'start'});return}const ch=e.target.closest('[data-chapter-go]');if(ch){view='points';chapterName=groups[Number(ch.dataset.chapterGo)][0];chapter.value=chapterName;render();window.scrollTo(0,0)}});
render();
})();
</script></body></html>
